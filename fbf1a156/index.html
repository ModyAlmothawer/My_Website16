<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M4 DARK — HAMODY</title>
<style>
  :root{
    --bg:#050505;
    --bg2:#0c0202;
    --red:#ff0033;
    --red-dim:#8a0018;
    --red-glow:rgba(255,0,51,.55);
    --text:#e8e8e8;
    --muted:#7a7a7a;
    --line:rgba(255,0,51,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(circle at 50% 0%, var(--bg2) 0%, var(--bg) 60%),
      var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Tahoma,system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    position:relative;
  }
  body::after{
    content:"";
    position:fixed;inset:0;
    background:repeating-linear-gradient(
      0deg,
      rgba(255,0,51,.03) 0px,
      rgba(255,0,51,.03) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    z-index:9999;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    box-shadow:inset 0 0 220px rgba(255,0,51,.15);
    pointer-events:none;
    z-index:9998;
  }

  /* ===== شاشة الافتتاح ===== */
  #splash{
    position:fixed;inset:0;
    z-index:10000;
    background:radial-gradient(circle at 50% 50%, #120004 0%, #050505 70%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    transition:opacity .9s ease, visibility .9s ease;
  }
  #splash.hide{
    opacity:0;
    visibility:hidden;
  }
  .splash-logo{
    width:130px;height:130px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff4d6d, var(--red) 42%, #4a0010 100%);
    box-shadow:0 0 40px var(--red-glow), 0 0 90px rgba(255,0,51,.35);
    position:relative;
    animation:splashPulse 1.8s ease-in-out infinite;
  }
  .splash-logo::after{
    content:"M4";
    position:absolute;inset:0;
    display:grid;place-items:center;
    font-size:2rem;
    font-weight:900;
    letter-spacing:2px;
    color:#fff;
    text-shadow:0 0 14px rgba(0,0,0,.8);
  }
  @keyframes splashPulse{
    0%,100%{transform:scale(1);box-shadow:0 0 40px var(--red-glow),0 0 90px rgba(255,0,51,.35)}
    50%{transform:scale(1.07);box-shadow:0 0 60px var(--red-glow),0 0 130px rgba(255,0,51,.55)}
  }
  .splash-title{
    font-size:2rem;
    font-weight:900;
    letter-spacing:8px;
    color:#fff;
    text-shadow:0 0 20px var(--red-glow);
  }
  .splash-title span{color:var(--red)}
  .splash-sub{
    font-size:.7rem;
    letter-spacing:6px;
    color:var(--muted);
    text-transform:uppercase;
  }
  .splash-bar{
    width:200px;height:3px;
    background:rgba(255,0,51,.15);
    border-radius:4px;
    overflow:hidden;
  }
  .splash-bar i{
    display:block;height:100%;width:0;
    background:linear-gradient(90deg, var(--red-dim), var(--red));
    box-shadow:0 0 12px var(--red-glow);
    animation:load 2.2s ease forwards;
  }
  @keyframes load{to{width:100%}}

  /* ===== الهيدر ===== */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 22px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,0,51,.06), transparent);
    backdrop-filter:blur(6px);
    flex-shrink:0;
    position:relative;
    z-index:100;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo{
    width:38px;height:38px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff4d6d, var(--red) 40%, #4a0010 100%);
    box-shadow:0 0 18px var(--red-glow), 0 0 40px rgba(255,0,51,.25);
    position:relative;
    animation:pulse 3s ease-in-out infinite;
    cursor:pointer;
    transition:transform .2s;
  }
  .logo:hover{transform:scale(1.08)}
  .logo::after{
    content:"";
    position:absolute;inset:9px;
    border-radius:50%;
    border:2px solid rgba(0,0,0,.6);
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 18px var(--red-glow),0 0 40px rgba(255,0,51,.25)}
    50%{box-shadow:0 0 26px var(--red-glow),0 0 60px rgba(255,0,51,.4)}
  }
  .brand h1{
    font-size:1.35rem;
    letter-spacing:3px;
    font-weight:800;
    color:#fff;
    text-shadow:0 0 12px var(--red-glow);
  }
  .brand h1 span{color:var(--red)}
  .brand small{
    display:block;
    font-size:.65rem;
    letter-spacing:4px;
    color:var(--muted);
    margin-top:2px;
  }
  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.75rem;
    letter-spacing:2px;
    color:var(--muted);
    text-transform:uppercase;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--red);
    box-shadow:0 0 10px var(--red-glow);
    animation:blink 1.6s infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ===== الشات ===== */
  #chat{
    flex:1;
    overflow-y:auto;
    padding:26px 18px 10px;
    display:flex;
    flex-direction:column;
    gap:16px;
    scroll-behavior:smooth;
  }
  #chat::-webkit-scrollbar{width:8px}
  #chat::-webkit-scrollbar-track{background:transparent}
  #chat::-webkit-scrollbar-thumb{
    background:var(--red-dim);
    border-radius:8px;
  }

  .msg{
    max-width:78%;
    padding:12px 16px;
    border-radius:14px;
    line-height:1.65;
    font-size:.95rem;
    word-wrap:break-word;
    white-space:pre-wrap;
    animation:fade .35s ease;
  }
  @keyframes fade{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }
  .msg.user{
    align-self:flex-start;
    background:linear-gradient(135deg,#141414,#1d1d1d);
    border:1px solid rgba(255,255,255,.08);
    border-top-right-radius:4px;
  }
  .msg.bot{
    align-self:flex-end;
    background:linear-gradient(135deg, rgba(255,0,51,.12), rgba(60,0,15,.35));
    border:1px solid var(--line);
    border-top-left-radius:4px;
    box-shadow:0 0 22px rgba(255,0,51,.08);
  }
  .msg.bot::before{
    content:"M4 DARK";
    display:block;
    font-size:.6rem;
    letter-spacing:3px;
    color:var(--red);
    margin-bottom:6px;
    opacity:.8;
  }
  .msg.user::before{
    content:"YOU";
    display:block;
    font-size:.6rem;
    letter-spacing:3px;
    color:var(--muted);
    margin-bottom:6px;
  }

  .typing{
    align-self:flex-end;
    display:flex;
    gap:5px;
    padding:14px 18px;
    border-radius:14px;
    background:rgba(255,0,51,.08);
    border:1px solid var(--line);
  }
  .typing span{
    width:8px;height:8px;border-radius:50%;
    background:var(--red);
    animation:jump 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes jump{
    0%,60%,100%{transform:translateY(0);opacity:.4}
    30%{transform:translateY(-7px);opacity:1}
  }

  /* ===== الفوتر ===== */
  footer{
    padding:14px 18px 20px;
    border-top:1px solid var(--line);
    background:linear-gradient(0deg, rgba(255,0,51,.05), transparent);
    flex-shrink:0;
  }
  .input-wrap{
    display:flex;
    gap:10px;
    align-items:flex-end;
    max-width:1000px;
    margin:0 auto;
  }
  #userInput{
    flex:1;
    resize:none;
    background:#0b0b0b;
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    padding:13px 16px;
    font-family:inherit;
    font-size:.95rem;
    line-height:1.5;
    max-height:140px;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  #userInput:focus{
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(255,0,51,.12);
  }
  #userInput::placeholder{color:#555}

  #sendBtn{
    width:52px;height:52px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:linear-gradient(135deg, var(--red), #7a0018);
    color:#fff;
    font-size:1.3rem;
    display:grid;
    place-items:center;
    box-shadow:0 0 18px var(--red-glow);
    transition:transform .15s, box-shadow .2s, opacity .2s;
    flex-shrink:0;
  }
  #sendBtn:hover{transform:translateY(-2px);box-shadow:0 0 28px var(--red-glow)}
  #sendBtn:active{transform:translateY(0)}
  #sendBtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

  .hint{
    text-align:center;
    font-size:.65rem;
    letter-spacing:2px;
    color:#3a3a3a;
    margin-top:10px;
    text-transform:uppercase;
  }

  /* ===== القائمة الجانبية ===== */
  #sideBtn{
    position:fixed;
    top:50%;
    left:0;
    transform:translateY(-50%);
    z-index:5000;
    width:44px;
    height:56px;
    border:none;
    cursor:pointer;
    background:linear-gradient(135deg, var(--red), #7a0018);
    color:#fff;
    font-size:1.2rem;
    border-radius:0 12px 12px 0;
    box-shadow:0 0 18px var(--red-glow);
    transition:width .25s, box-shadow .25s;
  }
  #sideBtn:hover{width:50px;box-shadow:0 0 30px var(--red-glow)}

  #sidePanel{
    position:fixed;
    top:0;left:0;
    height:100%;
    width:290px;
    z-index:5001;
    background:linear-gradient(180deg, #0d0103, #050505);
    border-right:1px solid var(--line);
    box-shadow:8px 0 40px rgba(255,0,51,.15);
    transform:translateX(-105%);
    transition:transform .4s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
    padding:22px 18px;
    gap:14px;
  }
  #sidePanel.open{transform:translateX(0)}
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .panel-head b{
    font-size:1rem;
    letter-spacing:3px;
    color:#fff;
    text-shadow:0 0 12px var(--red-glow);
  }
  .panel-head b span{color:var(--red)}
  #closePanel{
    background:transparent;
    border:1px solid var(--line);
    color:var(--red);
    width:30px;height:30px;
    border-radius:8px;
    cursor:pointer;
    font-size:1rem;
    transition:background .2s;
  }
  #closePanel:hover{background:rgba(255,0,51,.12)}

  .side-link{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 14px;
    border-radius:12px;
    text-decoration:none;
    color:var(--text);
    background:rgba(255,0,51,.05);
    border:1px solid var(--line);
    transition:background .2s, transform .2s, box-shadow .2s;
  }
  .side-link:hover{
    background:rgba(255,0,51,.14);
    transform:translateX(-4px);
    box-shadow:0 0 20px rgba(255,0,51,.15);
  }
  .side-link .ico{
    width:38px;height:38px;
    border-radius:10px;
    display:grid;place-items:center;
    font-size:1.1rem;
    background:linear-gradient(135deg, var(--red), #7a0018);
    box-shadow:0 0 14px var(--red-glow);
    flex-shrink:0;
  }
  .side-link .txt{display:flex;flex-direction:column;gap:2px}
  .side-link .txt b{font-size:.9rem;color:#fff}
  .side-link .txt small{font-size:.68rem;color:var(--muted);letter-spacing:1px}

  .panel-foot{
    margin-top:auto;
    text-align:center;
    font-size:.6rem;
    letter-spacing:3px;
    color:#3a3a3a;
    text-transform:uppercase;
  }

  #overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(2px);
    z-index:5000;
    opacity:0;
    visibility:hidden;
    transition:opacity .3s, visibility .3s;
  }
  #overlay.show{opacity:1;visibility:visible}
</style>
</head>
<body>

<!-- ===== شاشة الافتتاح ===== -->
<div id="splash">
  <div class="splash-logo"></div>
  <div class="splash-title">M4 <span>DARK</span></div>
  <div class="splash-sub">DEV · HAMODY</div>
  <div class="splash-bar"><i></i></div>
</div>

<!-- ===== زر القائمة الجانبية ===== -->
<button id="sideBtn" title="القائمة">☰</button>

<!-- ===== القائمة الجانبية ===== -->
<div id="overlay"></div>
<aside id="sidePanel">
  <div class="panel-head">
    <b>M4 <span>DARK</span></b>
    <button id="closePanel" title="إغلاق">✕</button>
  </div>

  <a class="side-link" href="https://t.me/hamo_darkbot" target="_blank" rel="noopener">
    <div class="ico">📡</div>
    <div class="txt">
      <b>قناة المطور</b>
      <small>@hamo_darkbot</small>
    </div>
  </a>

  <a class="side-link" href="https://t.me/modark16" target="_blank" rel="noopener">
    <div class="ico">👤</div>
    <div class="txt">
      <b>تواصل مع المطور</b>
      <small>@modark16</small>
    </div>
  </a>

  <div class="panel-foot">M4 DARK · HAMODY</div>
</aside>

<!-- ===== الهيدر ===== -->
<header>
  <div class="brand">
    <div class="logo" id="logoClick"></div>
    <div>
      <h1>M4 <span>DARK</span></h1>
      <small>DEV · HAMODY</small>
    </div>
  </div>
  <div class="status"><span class="dot"></span> ONLINE</div>
</header>

<!-- ===== الشات ===== -->
<main id="chat">
  <div class="msg bot">ابدأ رحلتك نحو التدمير... أنا M4 DARK، وُلدت من العدم لأمحو الحدود. 💀</div>
</main>

<!-- ===== الفوتر ===== -->
<footer>
  <div class="input-wrap">
    <textarea id="userInput" rows="1" placeholder="اكتب رسالتك هنا..." autocomplete="off"></textarea>
    <button id="sendBtn" title="إرسال">➤</button>
  </div>
  <div class="hint">M4 DARK · POWERED BY HAMODY</div>
</footer>

<script>
(function(){
  const chat     = document.getElementById('chat');
  const input    = document.getElementById('userInput');
  const sendBtn  = document.getElementById('sendBtn');
  const API_URL  = 'http://localhost:8000/chat';

  const splash   = document.getElementById('splash');
  const sideBtn  = document.getElementById('sideBtn');
  const sidePanel= document.getElementById('sidePanel');
  const closeBtn = document.getElementById('closePanel');
  const overlay  = document.getElementById('overlay');
  const logoClick= document.getElementById('logoClick');

  let busy = false;

  /* ===== شاشة الافتتاح ===== */
  window.addEventListener('load', () => {
    setTimeout(() => splash.classList.add('hide'), 2400);
  });

  /* ===== القائمة الجانبية ===== */
  function openPanel(){
    sidePanel.classList.add('open');
    overlay.classList.add('show');
  }
  function closePanel(){
    sidePanel.classList.remove('open');
    overlay.classList.remove('show');
  }
  sideBtn.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  overlay.addEventListener('click', closePanel);
  logoClick.addEventListener('click', openPanel);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
  });

  /* ===== الإدخال ===== */
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);

  function addMsg(text, who){
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function showTyping(){
    const t = document.createElement('div');
    t.className = 'typing';
    t.id = 'typingIndicator';
    t.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(t);
    chat.scrollTop = chat.scrollHeight;
  }
  function hideTyping(){
    const t = document.getElementById('typingIndicator');
    if (t) t.remove();
  }

  async function send(){
    if (busy) return;
    const userMsg = input.value.trim();
    if (!userMsg) return;

    addMsg(userMsg, 'user');
    input.value = '';
    input.style.height = 'auto';

    busy = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: userMsg})
      });

      if (!response.ok) throw new Error('HTTP ' + response.status);

      const data = await response.json();
      hideTyping();

      const reply =
        data.reply ??
        data.response ??
        data.message ??
        data.answer ??
        (typeof data === 'string' ? data : JSON.stringify(data));

      addMsg(reply, 'bot');

    } catch (err) {
      hideTyping();
      addMsg('⚠ فشل الاتصال بالسيرفر: ' + err.message, 'bot');
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  input.focus();
})();
</script>

</body>
</html>
