<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تلفزيون ساكورا</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
:root{--bg:#120e27;--panel:rgba(24,18,52,.72);--line:rgba(255,160,200,.22);--pink:#ff8fbd;--cyan:#6fe3ff;--text:#fdf3f8;--mute:#b9aed6}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Tajawal',sans-serif;color:var(--text);background:linear-gradient(#0d0a22 0%,#2a1650 55%,#6a2c70 85%,#e0698f 100%) fixed;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.moon{position:fixed;top:7vh;left:9vw;width:min(18vw,130px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#ffe9b8 60%,#f3c98a);box-shadow:0 0 60px 20px rgba(255,230,180,.35);z-index:0;animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 90px 34px rgba(255,230,180,.5)}}
.city{position:fixed;bottom:0;left:0;width:100%;height:26vh;z-index:0;pointer-events:none}
.city rect.w{fill:#ffd98a;animation:blink 4s infinite}
@keyframes blink{0%,100%{opacity:.9}50%{opacity:.15}}
.wrap{position:relative;z-index:1;max-width:1180px;margin:auto;padding:20px 16px 90px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.logo{font-family:'Reem Kufi',sans-serif;font-size:2rem;font-weight:700;letter-spacing:.5px;text-shadow:0 0 18px rgba(255,143,189,.7)}
.logo small{display:block;font-family:'Tajawal';font-size:.8rem;color:var(--mute);font-weight:400;text-shadow:none}
.sp{flex:1}
input,select,button,textarea{font:inherit;color:var(--text)}
.field{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:none;width:100%}
.field:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(111,227,255,.2)}
.search{max-width:260px}
.btn{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:12px;padding:10px 16px;transition:.2s}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.main{background:linear-gradient(135deg,#ff8fbd,#c38bff);border:0;color:#2a0f3a;font-weight:700}
.btn.danger{border-color:rgba(255,100,120,.5);color:#ff9aa8}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#stage{display:none;margin-bottom:22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;backdrop-filter:blur(10px)}
#stage.on{display:block}
.screen{aspect-ratio:16/9;width:100%;background:#000;border-radius:12px;overflow:hidden}
.screen video,.screen iframe{width:100%;height:100%;border:0;background:#000}
.now{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 2px;gap:10px}
.now b{font-family:'Reem Kufi';font-size:1.2rem}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px}
.chip{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:99px;padding:7px 16px;color:var(--mute)}
.chip.on{background:var(--pink);color:#2a0f3a;font-weight:700;border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 12px;text-align:center;backdrop-filter:blur(8px);transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--cyan)}
.card.live{border-color:var(--pink);box-shadow:0 0 22px rgba(255,143,189,.35)}
.ico{width:64px;height:64px;margin:0 auto 10px;border-radius:18px;background:linear-gradient(135deg,rgba(255,143,189,.3),rgba(111,227,255,.25));display:grid;place-items:center;font-size:1.9rem;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:contain}
.card b{display:block;font-weight:700}
.card span{font-size:.8rem;color:var(--mute)}
.empty{grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--mute);background:var(--panel);border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;font-family:'Reem Kufi';font-size:1.3rem;color:var(--text);margin-bottom:6px}
/* modal + drawer */
.veil{position:fixed;inset:0;z-index:20;background:rgba(8,5,22,.7);display:none;place-items:center;backdrop-filter:blur(4px)}
.veil.on{display:grid}
.box{width:min(380px,92vw);background:#1c1440;border:1px solid var(--line);border-radius:18px;padding:22px}
.box h3{font-family:'Reem Kufi';margin-bottom:12px}
.err{color:#ff9aa8;font-size:.85rem;min-height:1.2em;margin-top:6px}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(440px,100vw);z-index:15;background:#190f3a;border-left:1px solid var(--line);padding:18px;overflow-y:auto;transform:translateX(100%);transition:transform .3s}
.drawer.on{transform:none}
.drawer h2{font-family:'Reem Kufi';margin-bottom:4px}
.form{display:grid;gap:10px;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.item div{flex:1;min-width:0}
.item small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
.hint{font-size:.82rem;color:var(--mute);line-height:1.6}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="moon"></div>
<svg class="city" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
  <g fill="#0b0720">
    <rect x="0" y="90" width="90" height="110"/><rect x="95" y="50" width="70" height="150"/><rect x="170" y="110" width="110" height="90"/>
    <rect x="285" y="30" width="60" height="170"/><rect x="350" y="80" width="100" height="120"/><rect x="455" y="120" width="80" height="80"/>
    <rect x="540" y="60" width="75" height="140"/><rect x="620" y="100" width="120" height="100"/><rect x="745" y="20" width="55" height="180"/>
    <rect x="805" y="85" width="95" height="115"/><rect x="905" y="115" width="85" height="85"/><rect x="995" y="55" width="70" height="145"/>
    <rect x="1070" y="95" width="130" height="105"/>
  </g>
  <g>
    <rect class="w" x="105" y="70" width="8" height="10"/><rect class="w" x="130" y="100" width="8" height="10" style="animation-delay:1s"/>
    <rect class="w" x="295" y="55" width="8" height="10" style="animation-delay:2s"/><rect class="w" x="320" y="95" width="8" height="10"/>
    <rect class="w" x="555" y="85" width="8" height="10" style="animation-delay:.5s"/><rect class="w" x="580" y="120" width="8" height="10" style="animation-delay:3s"/>
    <rect class="w" x="755" y="45" width="8" height="10" style="animation-delay:1.5s"/><rect class="w" x="1005" y="80" width="8" height="10" style="animation-delay:2.5s"/>
    <rect class="w" x="370" y="105" width="8" height="10" style="animation-delay:.8s"/><rect class="w" x="830" y="110" width="8" height="10" style="animation-delay:3.4s"/>
  </g>
</svg>

<div class="wrap">
  <header>
    <div class="logo">تلفزيون ساكورا<small>قنواتك في مكان واحد</small></div>
    <div class="sp"></div>
    <input id="q" class="field search" type="search" placeholder="ابحث عن قناة">
    <button class="btn" id="devBtn">لوحة المطور</button>
  </header>

  <section id="stage" aria-live="polite">
    <div class="screen" id="screen"></div>
    <div class="now"><b id="nowName"></b><button class="btn" id="closeP">إغلاق البث</button></div>
  </section>

  <nav class="cats" id="cats"></nav>
  <main class="grid" id="grid"></main>
</div>

<div class="veil" id="login">
  <div class="box">
    <h3>دخول المطور</h3>
    <input id="pw" class="field" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="off">
    <div class="err" id="pwErr"></div>
    <div class="row" style="margin-top:10px"><button class="btn main" id="pwGo">دخول</button><button class="btn" id="pwNo">إلغاء</button></div>
  </div>
</div>

<aside class="drawer" id="drawer">
  <div class="row" style="align-items:center"><h2>لوحة المطور</h2><div class="sp"></div><button class="btn" id="out">خروج</button></div>
  <p class="hint">أضف القنوات هنا وستظهر في الموقع فوراً.</p>
  <div class="form">
    <input id="fName" class="field" placeholder="اسم القناة">
    <input id="fUrl" class="field" dir="ltr" placeholder="رابط البث (m3u8 / mp4 / رابط تضمين)">
    <input id="fCat" class="field" list="catList" placeholder="التصنيف (مثال: أنمي، رياضة، أخبار)">
    <datalist id="catList"></datalist>
    <input id="fLogo" class="field" dir="ltr" placeholder="رابط الشعار أو إيموجي (اختياري)">
    <button class="btn main" id="add">إضافة القناة</button>
  </div>
  <div id="list"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn" id="exp">تصدير القنوات</button>
    <button class="btn" id="imp">استيراد</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
  <p class="hint" style="margin-top:10px">ملاحظة: القنوات تُحفظ في هذا المتصفح. استخدم التصدير للنسخ الاحتياطي أو للنقل لجهاز آخر.</p>
</aside>

<script>
const KEY='sakura_tv_channels', PASS='mdark16';
const $=id=>document.getElementById(id);
let channels=[], cat='الكل', admin=false, hls=null, current=null;
try{channels=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(channels))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function icon(ch){
  const l=(ch.logo||'').trim();
  if(/^https?:/i.test(l)) return `<img src="${esc(l)}" alt="" onerror="this.parentNode.textContent='📺'">`;
  return l?esc(l):'📺';
}
function render(){
  const cats=['الكل',...new Set(channels.map(c=>c.cat).filter(Boolean))];
  if(!cats.includes(cat)) cat='الكل';
  $('cats').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('catList').innerHTML=cats.slice(1).map(c=>`<option value="${esc(c)}">`).join('');
  const q=$('q').value.trim().toLowerCase();
  const shown=channels.filter(c=>(cat==='الكل'||c.cat===cat)&&c.name.toLowerCase().includes(q));
  $('grid').innerHTML=shown.length?shown.map(c=>`<div class="card ${current===c.id?'live':''}" tabindex="0" role="button" data-id="${c.id}"><div class="ico">${icon(c)}</div><b>${esc(c.name)}</b><span>${esc(c.cat||'عام')}</span></div>`).join('')
   :`<div class="empty"><b>${channels.length?'لا توجد نتائج':'لا توجد قنوات بعد'}</b>${channels.length?'جرّب كلمة بحث أو تصنيفاً آخر.':'افتح لوحة المطور وأضف أول قناة.'}</div>`;
  $('list').innerHTML=channels.map(c=>`<div class="item"><div class="ico" style="width:42px;height:42px;font-size:1.2rem;margin:0;border-radius:12px">${icon(c)}</div><div><b>${esc(c.name)}</b><small>${esc(c.url)}</small></div><button class="btn danger" data-del="${c.id}">حذف</button></div>`).join('')||'<p class="hint">لا توجد قنوات مضافة.</p>';
}
function stop(){
  if(hls){hls.destroy();hls=null}
  $('screen').innerHTML='';
}
function play(ch){
  stop(); current=ch.id;
  const u=ch.url.trim(), s=$('screen');
  if(/^<iframe/i.test(u)){ const m=u.match(/src=["']([^"']+)/i); if(m) mkFrame(m[1]); }
  else if(/\.m3u8(\?|$)/i.test(u)){
    const v=document.createElement('video'); v.controls=true; v.autoplay=true; v.playsInline=true; s.appendChild(v);
    if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(u);hls.attachMedia(v)} else v.src=u;
  } else if(/\.(mp4|webm|ogg)(\?|$)/i.test(u)){
    const v=document.createElement('video'); v.controls=true; v.autoplay=true; v.playsInline=true; v.src=u; s.appendChild(v);
  } else mkFrame(u);
  $('nowName').textContent=ch.name;
  $('stage').classList.add('on');
  $('stage').scrollIntoView({behavior:'smooth',block:'start'});
  render();
}
function mkFrame(src){
  const f=document.createElement('iframe'); f.src=src; f.allow='autoplay; fullscreen; encrypted-media; picture-in-picture'; f.allowFullscreen=true; $('screen').appendChild(f);
}
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)play(channels.find(x=>x.id==c.dataset.id))});
$('grid').addEventListener('keydown',e=>{if(e.key==='Enter'){const c=e.target.closest('.card');if(c)c.click()}});
$('cats').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){cat=b.dataset.c;render()}});
$('q').addEventListener('input',render);
$('closeP').onclick=()=>{stop();current=null;$('stage').classList.remove('on');render()};

/* developer panel */
$('devBtn').onclick=()=>{ if(admin) $('drawer').classList.add('on'); else {$('login').classList.add('on');$('pw').value='';$('pwErr').textContent='';$('pw').focus()} };
$('pwNo').onclick=()=>$('login').classList.remove('on');
function tryLogin(){
  if($('pw').value===PASS){admin=true;$('login').classList.remove('on');$('drawer').classList.add('on')}
  else $('pwErr').textContent='كلمة المرور غير صحيحة، حاول مرة أخرى.';
}
$('pwGo').onclick=tryLogin;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});
$('out').onclick=()=>{admin=false;$('drawer').classList.remove('on')};
$('add').onclick=()=>{
  const name=$('fName').value.trim(), url=$('fUrl').value.trim();
  if(!name||!url){alert('اكتب اسم القناة ورابط البث.');return}
  channels.push({id:Date.now(),name,url,cat:$('fCat').value.trim(),logo:$('fLogo').value.trim()});
  save(); ['fName','fUrl','fCat','fLogo'].forEach(i=>$(i).value=''); render();
};
$('list').addEventListener('click',e=>{
  const d=e.target.dataset.del; if(!d) return;
  if(!confirm('حذف هذه القناة؟')) return;
  channels=channels.filter(c=>c.id!=d); if(current==d) $('closeP').click(); save(); render();
});
$('exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(channels,null,2)],{type:'application/json'}));
  a.download='channels.json'; a.click();
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{try{const a=JSON.parse(r.result);if(Array.isArray(a)){channels=a.filter(c=>c&&c.name&&c.url).map((c,i)=>({id:c.id||Date.now()+i,name:c.name,url:c.url,cat:c.cat||'',logo:c.logo||''}));save();render()}}catch(x){alert('الملف غير صالح.')}};
  r.readAsText(f);
};

/* animated sky: twinkling stars + drifting sakura petals */
const cv=$('sky'), cx=cv.getContext('2d'); let W,H,stars=[],petals=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;
  stars=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H*.65,r:Math.random()*1.4+.3,p:Math.random()*6.28,s:Math.random()*.03+.01}));
  petals=Array.from({length:Math.min(60,Math.round(W/22))},()=>np(true));}
function np(init){return{x:Math.random()*W,y:init?Math.random()*H:-20,s:Math.random()*8+5,vy:Math.random()*.9+.5,vx:Math.random()*.8-.6,a:Math.random()*6.28,va:Math.random()*.03-.015,w:Math.random()*6.28,o:Math.random()*.4+.5}}
function draw(){
  cx.clearRect(0,0,W,H);
  for(const s of stars){s.p+=s.s;cx.globalAlpha=.4+.6*Math.abs(Math.sin(s.p));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill()}
  for(const p of petals){
    p.w+=.02;p.x+=p.vx+Math.sin(p.w)*.6;p.y+=p.vy;p.a+=p.va;
    if(p.y>H+20||p.x<-30)Object.assign(p,np(false),{x:Math.random()*W+50});
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.globalAlpha=p.o;
    cx.fillStyle='#ffb3d0';cx.beginPath();cx.ellipse(0,0,p.s,p.s*.55,0,0,6.28);cx.fill();
    cx.fillStyle='#ff8fbd';cx.beginPath();cx.ellipse(p.s*.25,0,p.s*.45,p.s*.25,0,0,6.28);cx.fill();
    cx.restore();
  }
  requestAnimationFrame(draw);
}
addEventListener('resize',size); size(); draw(); render();
</script>
</body>
</html>
