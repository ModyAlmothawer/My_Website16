}

/* ---------- Media previews ---------- */
function updateMediaPreview(target){
  const el=document.getElementById(`${target}Preview`);
  if(!el)return;
  const files=target==='compose'?composeFiles:commentFiles;
  const audio=target==='compose'?composeAudio:commentAudio;
  el.innerHTML=`${files.map((f,i)=>`<span class="media-thumb"><img src="${f}" alt="" /><button data-action="remove-media" data-id="${target}:${i}" type="button">×</button></span>`).join('')}${audio?`${audioBubbleHTML(audio,null)}<button class="preview-audio-remove" data-action="remove-audio" data-id="${target}" type="button">×</button>`:''}`;
}
function handleFiles(input,target){
  const existing=target==='compose'?composeFiles:commentFiles;
  const files=[...(input.files||[])].filter(f=>f.type.startsWith('image/')).slice(0,5-existing.length);
  if(!files.length&&input.files?.length)toast(t('photosOnly'),'error');
  files.forEach(file=>{
    const r=new FileReader();
    r.onload=()=>{
      if(target==='compose')composeFiles.push(r.result);
      else commentFiles.push(r.result);
      updateMediaPreview(target);
    };
    r.readAsDataURL(file);
  });
  input.value='';
}
async function toggleRecording(target){
  if(recording){
    if(recording.target===target){try{recording.recorder.stop();}catch{}}
    return;
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return toast('Audio recording is not supported.','error');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const rec=new MediaRecorder(stream),chunks=[];
    recording={target,recorder:rec,chunks,stream};
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{
      const blob=new Blob(chunks,{type:'audio/webm'});
      const r=new FileReader();
      r.onload=()=>{
        if(target==='compose')composeAudio=r.result;
        else if(target==='comment')commentAudio=r.result;
        else if(target.startsWith('dm:')){
          const threadId=target.slice(3);
          sendDirectMessage(threadId,'',r.result);
          toast(t('voiceNote'));
          render();
        }
        recording=null;
        stream.getTracks().forEach(tr=>tr.stop());
        if(target==='compose'||target==='comment')updateMediaPreview(target);
        updateRecordingState();
      };
      r.readAsDataURL(blob);
    };
    rec.start();
    updateRecordingState();
  }catch{toast(t('microphonePermission'),'error');}
}
function updateRecordingState(){
  document.querySelectorAll('[data-action="toggle-recording"]').forEach(b=>{
    const isRec=!!recording&&recording.target===b.dataset.id;
    b.classList.toggle('recording',isRec);
    const ico=b.querySelector('.ico');
    if(ico){
      if(isRec){b.innerHTML=icon('close')+' '+(db.settings.lang==='ar'?'إيقاف':'Stop');}
      else{b.innerHTML=icon('mic')+' '+t('voice');}
    }
  });
}

/* ---------- Emoji & sticker picker ---------- */
function insertAtCursor(inputId,text){
  const el=document.getElementById(inputId);
  if(!el)return;
  const start=typeof el.selectionStart==='number'?el.selectionStart:el.value.length;
  const end=typeof el.selectionEnd==='number'?el.selectionEnd:el.value.length;
  el.value=el.value.slice(0,start)+text+el.value.slice(end);
  const pos=start+text.length;
  try{el.focus();el.setSelectionRange(pos,pos);}catch{}
  el.dispatchEvent(new Event('input',{bubbles:true}));
}
function closePickers(){document.querySelectorAll('.emoji-pop,.sticker-pop').forEach(p=>p.remove());}
function openEmojiPop(button,targetId){
  const already=button.parentElement.querySelector('.emoji-pop');
  closePickers();
  if(already)return;
  const pop=document.createElement('div');
  pop.className='emoji-pop';
  pop.innerHTML=EMOJIS.map(em=>`<button type="button" class="emoji-item" data-emoji-insert="${targetId}" data-emoji="${em}">${em}</button>`).join('');
  button.parentElement.classList.add('emoji-anchor');
  button.parentElement.appendChild(pop);
  const rect=button.getBoundingClientRect();
  if(rect.left+240>window.innerWidth-10){pop.style.insetInlineStart='auto';pop.style.insetInlineEnd='0';}
}
function openStickerPop(button,targetId){
  const already=button.parentElement.querySelector('.sticker-pop');
  closePickers();
  if(already)return;
  const pop=document.createElement('div');
  pop.className='sticker-pop';
  pop.innerHTML=STICKERS.map(em=>`<button type="button" class="sticker-item" data-emoji-insert="${targetId}" data-emoji="${em}">${em}</button>`).join('');
  button.parentElement.classList.add('emoji-anchor');
  button.parentElement.appendChild(pop);
}

/* =========================================================
   Action dispatcher
   ========================================================= */
function handleAction(action,id){
  const u=currentUser();
  if(!u&&action!=='verify-device'&&action!=='set-lang')return;

  /* -------- close / modal -------- */
  if(action==='close-modal'){closeModal();return;}

  /* -------- lang / theme -------- */
  if(action==='set-lang'){db.settings.lang=id;persist();closeModal();render();return;}
  if(action==='toggle-theme'){db.settings.theme=db.settings.theme==='dark'?'light':'dark';persist();render();return;}
  if(action==='toggle-setting-menu'){openSettingMenu=openSettingMenu===id?null:id;render();return;}
  if(action==='set-setting'){
    const [kind,value]=id.split(':');
    if(kind==='privacy')db.settings.privacy=value;
    if(kind==='accent')db.settings.accent=value;
    if(kind==='lang')db.settings.lang=value;
    openSettingMenu=null;
    persist();
    render();
    return;
  }
  if(action==='location'){db.settings.locationAsked=true;persist();render();toast(t('locationSaved'));return;}
  if(action==='remove-device'){
    if(id!==session.deviceId){
      db.devices=db.devices.filter(d=>d.id!==id);
      persist();
      render();
      toast(t('removeOtherDevice'));
    }
    return;
  }
  if(action==='logout'){
    db.devices=db.devices.filter(d=>d.id!==session.deviceId);
    session=null;
    persist();
    render();
    toast(t('loggedOut'));
    return;
  }
  if(action==='delete-account'){
    if(!confirm(t('deleteAccountWarn')))return;
    db.accounts=db.accounts.filter(a=>a.id!==u.id);
    db.posts=db.posts.filter(p=>p.ownerId!==u.id);
    db.comments=db.comments.filter(c=>c.userId!==u.id);
    db.likes=db.likes.filter(l=>l.userId!==u.id);
    db.bookmarks=db.bookmarks.filter(b=>b.userId!==u.id);
    db.follows=db.follows.filter(f=>f.a!==u.id&&f.b!==u.id);
    db.followRequests=db.followRequests.filter(r=>r.a!==u.id&&r.b!==u.id);
    db.devices=db.devices.filter(d=>d.userId!==u.id);
    db.direct=db.direct.filter(d=>d.a!==u.id&&d.b!==u.id);
    db.stories=db.stories.filter(s=>s.userId!==u.id);
    db.notifications=db.notifications.filter(n=>n.userId!==u.id&&n.fromId!==u.id);
    session=null;
    persist();
    render();
    return;
  }

  /* -------- navigation -------- */
  if(action==='go-home'){activeView='home';activeThread=null;searchTerm='';render();return;}
  if(action==='open-bookmarks'){activeView='bookmarks';render();return;}
  if(action==='search-tab'){searchTab=id;render();return;}
  if(action==='thread-tab'){activeThreadTab=id;activeThread=null;render();return;}
  if(action==='open-profile'){activeView='profile';activeThread=null;render();setTimeout(()=>{const html=profileView(id);app.querySelector('.main-pane').innerHTML=html;bindApp();},0);return;}
  if(action==='open-hashtag'){searchTerm=id;activeView='search';searchTab='posts';render();return;}

  /* -------- notifications -------- */
  if(action==='notifications'){activeView='notifications';db.notifications.filter(n=>n.userId===u.id).forEach(n=>n.read=true);persist();render();return;}
  if(action==='mark-all-notifs'){db.notifications.filter(n=>n.userId===u.id).forEach(n=>n.read=true);persist();render();return;}
  if(action==='accept-follow'){acceptFollowRequest(id);return;}
  if(action==='decline-follow'){declineFollowRequest(id);return;}

  /* -------- follow -------- */
  if(action==='toggle-follow'){toggleFollow(id);return;}

  /* -------- messages -------- */
  if(action==='open-support'){activeThread='support';activeThreadTab='direct';render();return;}
  if(action==='open-dm'){activeThread=`dm:${id}`;activeThreadTab='direct';render();return;}
  if(action==='open-dm-with'){
    openDirectChat(id);
    return;
  }
  if(action==='open-group'){activeThread=`group:${id}`;activeThreadTab='groups';render();return;}
  if(action==='close-thread'){activeThread=null;render();return;}
  if(action==='new-message-menu'){openNewMessageMenu();return;}
  if(action==='send-dm'){
    const input=document.getElementById('dmInput');
    const text=(input?.value||'').trim();
    if(!text)return;
    sendDirectMessage(id,text,null);
    render();
    return;
  }
  if(action==='send-support'){
    const input=document.getElementById('supportInput');
    const text=(input?.value||'').trim();
    if(!text)return toast(t('writeMessageFirst'),'error');
    db.unsent.push({userId:u.id,text,createdAt:new Date().toISOString()});
    persist();
    render();
    return;
  }
  if(action==='send-group'){
    const g=db.groups.find(x=>x.id===id);
    const input=document.getElementById('groupInput');
    const text=(input?.value||'').trim();
    if(!g||!text)return;
    g.messages.push({userId:u.id,username:u.username,text,createdAt:new Date().toISOString()});
    persist();
    render();
    return;
  }
  if(action==='dm-attach'){
    const input=document.createElement('input');
    input.type='file';input.accept='image/*';
    input.onchange=()=>{
      const f=input.files?.[0];if(!f)return;
      const r=new FileReader();
      r.onload=()=>{sendDirectMessage(id,'',r.result);render();toast(t('imageAttached'));};
      r.readAsDataURL(f);
    };
    input.click();
    return;
  }
  if(action==='create-group'){openCreateGroup('group');return;}
  if(action==='create-channel'){openCreateGroup('channel');return;}
  if(action==='save-group'){
    const name=document.getElementById('newGroupName')?.value.trim();
    if(!name)return toast(t('addNameFirst'),'error');
    const g={
      id:uid('group'),name,type:id,
      members:[{userId:u.id,role:'Owner'}],
      messages:[],
      createdAt:new Date().toISOString()
    };
    db.groups.push(g);
    persist();
    closeModal();
    activeThread=`group:${g.id}`;
    activeThreadTab='groups';
    render();
    return;
  }
  if(action==='group-info'){openGroupInfo(id);return;}
  if(action==='leave-group'){
    db.groups=db.groups.filter(g=>g.id!==id);
    persist();
    closeModal();
    activeThread=null;
    render();
    return;
  }

  /* -------- messages bubble menu -------- */
  if(action==='bubble-menu'){
    openMessageDropdown=openMessageDropdown===id?null:id;
    render();
    return;
  }
  if(action==='bubble-reply'){
    const d=db.direct.find(x=>x.id===id);
    const msg=d?.messages.find(m=>m.id===id);
    const input=document.getElementById('dmInput');
    if(input&&msg&&!msg.deleted){
      insertAtCursor('dmInput',`> @${accountById(msg.fromId)?.username||''}: ${(msg.text||t('voiceNote')).slice(0,80)}\n`);
    }
    openMessageDropdown=null;
    return;
  }
  if(action==='bubble-copy'){
    const d=db.direct.find(x=>x.id===arguments[2]||x.id===id);
    const msg=d?.messages.find(m=>m.id===id)||db.direct.flatMap(x=>x.messages).find(m=>m.id===id);
    if(msg?.text)navigator.clipboard?.writeText(msg.text);
    toast(t('copiedToClipboard'));
    openMessageDropdown=null;
    render();
    return;
  }
  if(action==='bubble-edit'){
    const msg=db.direct.flatMap(x=>x.messages).find(m=>m.id===id);
    if(!msg||msg.fromId!==u.id)return;
    const next=prompt(t('editMessage'),msg.text||'');
    if(next!==null&&next!==undefined){
      msg.text=next.trim();
      msg.edited=true;
      persist();
    }
    openMessageDropdown=null;
    render();
    return;
  }
  if(action==='bubble-delete'){
    const msg=db.direct.flatMap(x=>x.messages).find(m=>m.id===id);
    if(!msg||msg.fromId!==u.id)return;
    msg.deleted=true;
    msg.text='';
    msg.audio=null;
    persist();
    openMessageDropdown=null;
    render();
    return;
  }

  /* -------- feed -------- */
  if(action==='compose'){openCompose();return;}
  if(action==='publish'){
    const text=document.getElementById('postText')?.value.trim()||'';
    if(!text&&!composeFiles.length&&!composeAudio)return toast(t('addSomethingFirst'),'error');
    db.posts.push({
      id:uid('post'),
      ownerId:u.id,
      text,
      images:composeFiles,
      audio:composeAudio,
      createdAt:new Date().toISOString(),
      visibility:db.settings.privacy
    });
    persist();
    closeModal();
    render();
    toast(t('signalPublished'));
    return;
  }
  if(action==='compose-attach'){document.getElementById('composeFile')?.click();return;}
  if(action==='comment-attach'){document.getElementById('commentFile')?.click();return;}
  if(action==='toggle-recording'){toggleRecording(id||'compose');return;}
  if(action==='like'){
    const i=db.likes.findIndex(l=>l.postId===id&&l.userId===u.id);
    if(i>=0)db.likes.splice(i,1);
    else{
      db.likes.push({id:uid('like'),postId:id,userId:u.id,createdAt:new Date().toISOString()});
      const p=db.posts.find(x=>x.id===id);
      if(p)pushNotification({userId:p.ownerId,type:'like',fromId:u.id,ref:id});
    }
    persist();
    render();
    return;
  }
  if(action==='comments'){openComments(id);return;}
  if(action==='share'){openShareSheet(id);return;}
  if(action==='share-to'){
    const [postId,toId]=id.split(':');
    const p=db.posts.find(x=>x.id===postId);
    if(!p)return;
    const d=getDirectThread(toId);
    if(!d)return;
    d.messages.push({
      id:uid('msg'),
      fromId:u.id,
      text:`${db.settings.lang==='ar'?'شارك منشوراً':'Shared a post'}:\n${p.text||''}`,
      audio:null,image:p.images?.[0]||null,
      createdAt:new Date().toISOString(),
      read:false,deleted:false,edited:false
    });
    pushNotification({userId:toId,type:'message',fromId:u.id,text:t('sentYouMessage')});
    persist();
    closeModal();
    toast(db.settings.lang==='ar'?'تمت المشاركة.':'Shared.');
    return;
  }
  if(action==='bookmark'){
    const i=db.bookmarks.findIndex(b=>b.postId===id&&b.userId===u.id);
    if(i>=0){db.bookmarks.splice(i,1);toast(t('removedFromSaved'));}
    else{db.bookmarks.push({id:uid('bm'),postId:id,userId:u.id,createdAt:new Date().toISOString()});toast(t('savedToCollection'));}
    persist();
    render();
    return;
  }
  if(action==='post-menu'){openPostDropdown=openPostDropdown===id?null:id;render();return;}
  if(action==='close-post-menu'){openPostDropdown=null;render();return;}
  if(action==='edit-post'){
    const p=db.posts.find(x=>x.id===id);if(!p)return;
    const next=prompt(t('editPost'),p.text||'');
    if(next!==null&&next!==undefined){
      p.text=next.trim();
      p.editedAt=new Date().toISOString();
      persist();
    }
    openPostDropdown=null;
    render();
    return;
  }
  if(action==='delete-post'){
    if(!confirm(t('deletePostConfirm')))return;
    db.posts=db.posts.filter(p=>p.id!==id);
    db.comments=db.comments.filter(c=>c.postId!==id);
    db.likes=db.likes.filter(l=>l.postId!==id);
    db.bookmarks=db.bookmarks.filter(b=>b.postId!==id);
    persist();
    openPostDropdown=null;
    render();
    return;
  }

  /* -------- comments -------- */
  if(action==='add-comment'){
    const input=document.getElementById('commentInput');
    const text=(input?.value||'').trim();
    if(!text&&!commentFiles.length&&!commentAudio)return toast(t('addCommentFirst'),'error');
    db.comments.push({
      id:uid('comment'),
      postId:id,
      userId:u.id,
      text,
      images:commentFiles,
      audio:commentAudio,
      likedBy:[],
      replies:[],
      createdAt:new Date().toISOString()
    });
    const p=db.posts.find(x=>x.id===id);
    if(p)pushNotification({userId:p.ownerId,type:'comment',fromId:u.id,ref:id});
    persist();
    openComments(id);
    return;
  }
  if(action==='like-comment'){
    const c=db.comments.find(x=>x.id===id);if(!c)return;
    const a=c.likedBy||[];
    const i=a.indexOf(u.id);
    if(i>=0)a.splice(i,1);else a.push(u.id);
    c.likedBy=a;
    persist();
    const pid=c.postId;
    openComments(pid);
    return;
  }
  if(action==='comment-menu'){openCommentMenu(id);return;}
  if(action==='edit-comment'){
    const c=db.comments.find(x=>x.id===id);if(!c)return;
    const next=prompt(t('editComment'),c.text||'');
    if(next!==null&&next!==undefined){c.text=next.trim();persist();}
    openComments(c.postId);
    return;
  }
  if(action==='delete-comment'){
    const c=db.comments.find(x=>x.id===id);if(!c)return;
    const pid=c.postId;
    db.comments=db.comments.filter(x=>x.id!==id);
    persist();
    openComments(pid);
    return;
  }
  if(action==='open-comment-reply'){openCommentReply(id);return;}
  if(action==='submit-reply'){
    const c=db.comments.find(x=>x.id===id);if(!c)return;
    const text=document.getElementById('replyText')?.value.trim();
    if(!text)return toast(t('addReplyFirst'),'error');
    if(!c.replies)c.replies=[];
    c.replies.push({
      id:uid('reply'),
      userId:u.id,
      text,
      createdAt:new Date().toISOString()
    });
    persist();
    openComments(c.postId);
    return;
  }
  if(action==='remove-media'){
    const [k,index]=id.split(':');
    const arr=k==='compose'?composeFiles:commentFiles;
    arr.splice(Number(index),1);
    updateMediaPreview(k);
    return;
  }
  if(action==='remove-audio'){
    if(id==='compose')composeAudio=null;else commentAudio=null;
    updateMediaPreview(id);
    return;
  }

  /* -------- camera -------- */
  if(action==='open-camera'){openCameraModal(id||'compose');return;}
  if(action==='camera-close'){stopCamera();closeModal();return;}
  if(action==='camera-snap'){snapCameraPhoto();return;}
  if(action==='camera-flip'){cameraFacing=cameraFacing==='user'?'environment':'user';startCamera();return;}

  /* -------- stories -------- */
  if(action==='add-story'){openStoryCamera();return;}
  if(action==='view-story-user'){openStoryViewer(id);return;}
  if(action==='story-next'){storyNext();return;}
  if(action==='story-prev'){storyPrev();return;}
  if(action==='close-story'){closeStory();return;}

  /* -------- calls -------- */
  if(action==='start-call'){openCallModal(id||'support');return;}
  if(action==='call-toggle-mic'){callToggleMic();return;}
  if(action==='call-toggle-cam'){callToggleCam();return;}
  if(action==='call-toggle-share'){callToggleShare();return;}
  if(action==='call-toggle-speaker'){callToggleSpeaker();return;}
  if(action==='call-end'){callEnd();return;}

  /* -------- camera/profile photo -------- */
  if(action==='change-photo'){document.getElementById('photoInput')?.click();return;}

  /* -------- profile more / block / report -------- */
  if(action==='profile-more'){openProfileMore(id);return;}
  if(action==='toggle-block'){
    const idx=db.blocked.findIndex(b=>b.userId===u.id&&b.blockedId===id);
    if(idx>=0){
      db.blocked.splice(idx,1);
      persist();
      closeModal();
      toast(t('unblocked'));
    }else{
      const target=accountById(id);
      if(!target)return;
      if(!confirm(t('blockConfirm',{u:target.username})))return;
      db.blocked.push({userId:u.id,blockedId:id,createdAt:new Date().toISOString()});
      db.follows=db.follows.filter(f=>!(f.a===u.id&&f.b===id)&&!(f.a===id&&f.b===u.id));
      db.followRequests=db.followRequests.filter(r=>!(r.a===u.id&&r.b===id)&&!(r.a===id&&r.b===u.id));
      persist();
      closeModal();
      toast(t('blocked'));
    }
    render();
    return;
  }
  if(action==='open-blocked'){openBlockedList();return;}
  if(action==='report-user'){openReportDialog(id,null);return;}
  if(action==='submit-report'){
    const parts=id.split(':');
    const targetUserId=parts[0];
    const postId=parts[1];
    const reason=parts[2];
    db.reports.push({
      id:uid('report'),
      byId:u.id,
      userId:targetUserId||null,
      postId:postId||null,
      reason,
      createdAt:new Date().toISOString()
    });
    persist();
    closeModal();
    toast(t('reportSent'));
    return;
  }
  if(action==='copy-link'){
    const acc=accountById(id);
    if(acc)navigator.clipboard?.writeText(`https://yogarm.app/@${acc.username}`);
    toast(t('copiedToClipboard'));
    closeModal();
    return;
  }

  /* -------- diamonds / max -------- */
  if(action==='show-diamonds'){openDiamonds();return;}
  if(action==='diamond-plan'){
    diamondPlan=Number(id);
    document.querySelectorAll('.diamond-pack').forEach(b=>b.classList.toggle('selected',b.dataset.id===String(diamondPlan)));
    return;
  }
  if(action==='diamond-next'){
    if(!diamondPlan)return toast(t('choosePackFirst'),'error');
    openDiamondCheckout();
    return;
  }
  if(action==='diamond-purchase'){
    const num=(document.getElementById('cardNumber')?.value||'').replace(/\D/g,'');
    const exp=document.getElementById('cardExpiry')?.value||'';
    const cvv=document.getElementById('cardCvv')?.value||'';
    const err=document.getElementById('cardError');
    const valid=validLuhn(num)&&/^(0[1-9]|1[0-2])\/\d{2}$/.test(exp)&&/^\d{3,4}$/.test(cvv);
    if(!valid){if(err)err.textContent=t('invalidCard');return;}
    db.wallet+=diamondPlan;
    persist();
    closeModal();
    render();
    toast(t('diamondsAdded',{n:formatNumber(diamondPlan)}));
    return;
  }
  if(action==='show-max'){openMax();return;}
  if(action==='max-feature'){openMax(id);return;}
  if(action==='choose-gift'){db.maxGift={choice:Number(id),charged:false};persist();openMax('gift');return;}
  if(action==='subscribe-max'){
    if(db.wallet<500)return toast(t('need500'),'error');
    db.wallet-=500;
    db.maxActive=true;
    persist();
    closeModal();
    render();
    toast(t('maxActivated'));
    return;
  }

  /* -------- verify -------- */
  if(action==='verify-device'){
    const ev=db.securityEvents.find(x=>x.id===id);
    const digits=[...modalRoot.querySelectorAll('[data-code-index]')].map(x=>x.value).join('');
    if(!ev||digits!==ev.code)return toast(t('invalidCode'),'error');
    ev.used=true;
    const d={
      id:uid('device'),
      userId:ev.userId,
      name:ev.deviceName,
      type:/mobile|android|iphone/i.test(navigator.userAgent)?'mobile':'desktop',
      meta:navigator.platform||'Web session',
      lastActive:new Date().toISOString()
    };
    db.devices.push(d);
    session={userId:ev.userId,deviceId:d.id};
    persist();
    closeModal();
    activeView='home';
    render();
    toast(t('verifySuccess'));
    return;
  }

  /* -------- emoji / stickers (opened by delegation) -------- */
  if(action==='open-stickers'){
    const btn=document.querySelector(`[data-action="open-stickers"][data-id="${id}"]`);
    if(btn)openStickerPop(btn,id);
    return;
  }
}
function openDirectChat(otherId){
  activeThread=`dm:${otherId}`;
  activeView='messages';
  activeThreadTab='direct';
  render();
}

/* =========================================================
   Call helpers
   ========================================================= */
async function callToggleMic(){
  if(!callState)return;
  callState.muted=!callState.muted;
  if(callState.selfStream)callState.selfStream.getAudioTracks().forEach(t=>t.enabled=!callState.muted);
  const btn=document.querySelector('[data-action="call-toggle-mic"]');
  if(btn){
    btn.classList.toggle('active',callState.muted);
    btn.innerHTML=`${icon(callState.muted?'mic-off':'mic')}<small>${callState.muted?t('unmute'):t('mic')}</small>`;
  }
  toast(callState.muted?t('micMuted'):t('micOn'));
}
async function callToggleCam(){
  if(!callState)return;
  if(!callState.camOn){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
      callState.selfStream=stream;
      callState.camOn=true;
      const box=document.getElementById('callSelf'),v=document.getElementById('callSelfVideo');
      if(box)box.style.display='block';
      if(v){v.srcObject=stream;await v.play().catch(()=>{});}
      const btn=document.querySelector('[data-action="call-toggle-cam"]');
      if(btn){btn.classList.add('active');btn.innerHTML=`${icon('camera')}<small>${t('cameraOn')}</small>`;}
      toast(t('cameraTurnedOn'));
    }catch{toast(t('cameraPermission'),'error');}
  }else{
    if(callState.selfStream)callState.selfStream.getTracks().forEach(t=>t.stop());
    callState.selfStream=null;
    callState.camOn=false;
    const box=document.getElementById('callSelf'),v=document.getElementById('callSelfVideo');
    if(v)v.srcObject=null;
    if(box)box.style.display='none';
    const btn=document.querySelector('[data-action="call-toggle-cam"]');
    if(btn){btn.classList.remove('active');btn.innerHTML=`${icon('camera')}<small>${t('camera')}</small>`;}
    toast(t('cameraTurnedOff'));
  }
}
async function callToggleShare(){
  if(!callState)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia)return toast(t('screenShareNotSupported'),'error');
  if(!callState.sharing){
    try{
      const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
      callState.displayStream=stream;
      callState.sharing=true;
      const stage=document.getElementById('callStage');
      if(stage){
        let big=stage.querySelector('#callMainShare');
        if(!big){
          big=document.createElement('video');
          big.id='callMainShare';
          big.autoplay=true;big.playsInline=true;big.muted=true;big.className='call-main-share';
          stage.appendChild(big);
        }
        big.srcObject=stream;
        await big.play().catch(()=>{});
        stage.classList.add('sharing');
      }
      const badge=document.getElementById('shareBadge');
      if(badge)badge.style.display='inline-flex';
      const btn=document.querySelector('[data-action="call-toggle-share"]');
      if(btn){btn.classList.add('active');btn.innerHTML=`${icon('screen-off')}<small>${t('stopShare')}</small>`;}
      const vt=stream.getVideoTracks()[0];
      if(vt)vt.addEventListener('ended',()=>{if(callState&&callState.sharing)callToggleShare();});
      toast(t('screenShareStarted'));
    }catch{toast(t('screenSharePermission'),'error');}
  }else{
    if(callState.displayStream)callState.displayStream.getTracks().forEach(t=>t.stop());
    callState.displayStream=null;
    callState.sharing=false;
    const big=document.getElementById('callMainShare');if(big)big.remove();
    const stage=document.getElementById('callStage');if(stage)stage.classList.remove('sharing');
    const badge=document.getElementById('shareBadge');if(badge)badge.style.display='none';
    const btn=document.querySelector('[data-action="call-toggle-share"]');
    if(btn){btn.classList.remove('active');btn.innerHTML=`${icon('screen-share')}<small>${t('screenShare')}</small>`;}
    toast(t('screenShareStopped'));
  }
}
function callToggleSpeaker(){
  if(!callState)return;
  callState.speakerOn=!callState.speakerOn;
  const btn=document.querySelector('[data-action="call-toggle-speaker"]');
  if(btn){
    btn.classList.toggle('active',callState.speakerOn);
    btn.innerHTML=`${icon(callState.speakerOn?'volume':'volume-off')}<small>${callState.speakerOn?'On':t('speaker')}</small>`;
  }
  toast(callState.speakerOn?t('speakerOn'):t('speakerOff'));
}
function callEnd(){
  if(callState){
    if(callState.selfStream)callState.selfStream.getTracks().forEach(t=>t.stop());
    if(callState.displayStream)callState.displayStream.getTracks().forEach(t=>t.stop());
    db.calls.push({
      id:uid('call'),
      byId:callState.byId,
      withId:callState.withId,
      startedAt:callState.started.toISOString(),
      duration:callState.elapsed,
      answered:callState.answered
    });
    persist();
  }
  callState=null;
  if(callTimerInterval){clearInterval(callTimerInterval);callTimerInterval=null;}
  closeModal();
  toast(t('callEnded'));
}

/* =========================================================
   bindModal — for modal-only interactions (emojis, files, comment long-press)
   ========================================================= */
function bindModal(){
  const cf=document.getElementById('composeFile');
  if(cf)cf.addEventListener('change',()=>handleFiles(cf,'compose'));
  const cm=document.getElementById('commentFile');
  if(cm)cm.addEventListener('change',()=>handleFiles(cm,'comment'));
  updateRecordingState();
}
function closeModal(){
  closePickers();
  if(recording){try{recording.recorder.stop();}catch{}recording=null;}
  if(cameraStream)stopCamera();
  if(callState){
    if(callState.selfStream)callState.selfStream.getTracks().forEach(t=>t.stop());
    if(callState.displayStream)callState.displayStream.getTracks().forEach(t=>t.stop());
    callState=null;
  }
  if(callTimerInterval){clearInterval(callTimerInterval);callTimerInterval=null;}
  if(storyTimer){clearInterval(storyTimer);storyTimer=null;}
  if(storyStream){storyStream.getTracks().forEach(t=>t.stop());storyStream=null;}
  viewerState=null;
  modalRoot.innerHTML='';
}

/* =========================================================
   Global event delegation
   ========================================================= */
document.addEventListener('click',e=>{
  /* View switches */
  const viewBtn=e.target.closest('[data-view]');
  if(viewBtn&&!e.target.closest('[data-action]')){
    e.preventDefault();
    activeView=viewBtn.dataset.view;
    searchTerm='';
    if(activeView!=='messages')activeThread=null;
    render();
    return;
  }
  /* Emoji toggle */
  const emoBtn=e.target.closest('[data-emoji-toggle]');
  if(emoBtn){
    e.preventDefault();
    e.stopPropagation();
    openEmojiPop(emoBtn,emoBtn.getAttribute('data-emoji-toggle'));
    return;
  }
  /* Emoji / sticker insert */
  const emoItem=e.target.closest('[data-emoji-insert]');
  if(emoItem){
    e.preventDefault();
    e.stopPropagation();
    insertAtCursor(emoItem.getAttribute('data-emoji-insert'),emoItem.getAttribute('data-emoji'));
    return;
  }
  /* Close pickers on outside click */
  if(!e.target.closest('.emoji-pop,.sticker-pop'))closePickers();
  /* Actions */
  const actBtn=e.target.closest('[data-action]');
  if(actBtn){
    e.preventDefault();
    handleAction(actBtn.dataset.action,actBtn.dataset.id);
    return;
  }
  /* Overlay background close */
  const ov=e.target.closest('[data-close-overlay]');
  if(ov&&e.target===ov){closeModal();return;}
  /* Audio play */
  const audioBtn=e.target.closest('.audio-play');
  if(audioBtn){e.stopPropagation();toggleAudio(audioBtn);return;}
  /* Post dropdown outside */
  if(openPostDropdown&&!e.target.closest('.post-menu')&&!e.target.closest('.post-dropdown')){
    openPostDropdown=null;
    if(currentUser())render();
  }
  if(openMessageDropdown&&!e.target.closest('.bubble-menu-btn')&&!e.target.closest('.post-dropdown')){
    openMessageDropdown=null;
    if(currentUser())render();
  }
},true);

/* Comment long press for menu */
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.comment');
  if(!el)return;
  if(e.target.closest('button'))return;
  const commentId=el.dataset.commentId;
  if(!commentId)return;
  clearTimeout(el._lpTimer);
  el._lpTimer=setTimeout(()=>openCommentMenu(commentId),650);
},true);
document.addEventListener('pointerup',e=>{
  const el=e.target.closest('.comment');
  if(el&&el._lpTimer){clearTimeout(el._lpTimer);el._lpTimer=null;}
},true);
document.addEventListener('pointercancel',e=>{
  const el=e.target.closest('.comment');
  if(el&&el._lpTimer){clearTimeout(el._lpTimer);el._lpTimer=null;}
},true);
document.addEventListener('contextmenu',e=>{
  const el=e.target.closest('.comment');
  if(el){
    e.preventDefault();
    openCommentMenu(el.dataset.commentId);
  }
});

/* Send on Enter for chat inputs */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    closePickers();
    if(modalRoot.innerHTML)closeModal();
    return;
  }
  if(e.key==='Enter'&&!e.shiftKey){
    const target=e.target;
    if(!target)return;
    if(target.id==='dmInput'){
      e.preventDefault();
      const v=target.value.trim();
      if(!v)return;
      const threadId=activeThread&&activeThread.startsWith('dm:')?null:null;
      const dm=db.direct.find(x=>{
        const other=x.a===currentUser().id?x.b:x.a;
        return `dm:${other}`===activeThread;
      });
      if(dm){sendDirectMessage(dm.id,v,null);render();}
    }
    if(target.id==='supportInput'){
      e.preventDefault();
      const v=target.value.trim();
      if(v){db.unsent.push({userId:currentUser().id,text:v,createdAt:new Date().toISOString()});persist();render();}
    }
    if(target.id==='groupInput'){
      e.preventDefault();
      const v=target.value.trim();
      const gid=activeThread&&activeThread.startsWith('group:')?activeThread.slice(6):null;
      const g=db.groups.find(x=>x.id===gid);
      if(g&&v){g.messages.push({userId:currentUser().id,username:currentUser().username,text:v,createdAt:new Date().toISOString()});persist();render();}
    }
    if(target.id==='commentInput'){
      e.preventDefault();
      const v=target.value.trim();
      const postId=document.querySelector('[data-action="add-comment"]')?.dataset.id;
      if(postId&&v){
        db.comments.push({id:uid('comment'),postId,userId:currentUser().id,text:v,images:[],audio:null,likedBy:[],replies:[],createdAt:new Date().toISOString()});
        persist();
        openComments(postId);
      }
    }
  }
});

/* Audio toggle */
function toggleAudio(button){
  const card=button.closest('[data-audio-src]');
  if(!card)return;
  let audio=card._audio;
  if(!audio){
    audio=new Audio(card.dataset.audioSrc);
    card._audio=audio;
    audio.addEventListener('timeupdate',()=>{
      const fill=card.querySelector('.audio-fill');
      if(fill)fill.style.width=audio.duration?`${audio.currentTime/audio.duration*100}%`:'0%';
    });
    audio.addEventListener('ended',()=>{button.innerHTML='<span class="play-glyph">▶</span>';});
  }
  if(audio.paused){audio.play();button.innerHTML='<span class="play-glyph">Ⅱ</span>';}
  else{audio.pause();button.innerHTML='<span class="play-glyph">▶</span>';}
}

/* =========================================================
   Boot
   ========================================================= */
function boot(){
  applyTheme();
  if(!currentUser()){render();return;}
  const d=db.devices.find(x=>x.id===session.deviceId);
  if(d){d.lastActive=new Date().toISOString();persist();}
  render();
}
window.addEventListener('beforeunload',()=>{
  if(cameraStream)stopCamera();
  if(callState){
    if(callState.selfStream)callState.selfStream.getTracks().forEach(t=>t.stop());
    if(callState.displayStream)callState.displayStream.getTracks().forEach(t=>t.stop());
  }
});
boot();
</script>
