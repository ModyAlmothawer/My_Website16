<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ff6b5f" />
<meta name="description" content="Yogarm — دائرة اجتماعية هادئة لأصدقائك." />
<title>Yogarm — دائرتك، بوعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fc;--bg-soft:#eef1f7;--surface:rgba(255,255,255,.84);--surface-solid:#fff;--surface-strong:#fff;
  --line:rgba(15,23,42,.09);--ink:#101827;--muted:#6c7485;--muted-2:#9aa1ae;
  --signal:#ff6b5f;--signal-deep:#ed5048;--signal-wash:rgba(255,107,95,.12);
  --mint:#b8e8da;--lavender:#dcd5ff;
  --shadow:0 24px 70px rgba(31,41,61,.12);--shadow-soft:0 10px 30px rgba(31,41,61,.08);
  --radius-xl:30px;--radius-lg:22px;--radius-md:15px;--radius-sm:11px;
}
[data-theme="dark"]{
  --bg:#0d1220;--bg-soft:#151c2e;--surface:rgba(22,29,45,.84);--surface-solid:#161d2d;--surface-strong:#1d2639;
  --line:rgba(255,255,255,.09);--ink:#f7f9ff;--muted:#a8b0c0;--muted-2:#778197;
  --shadow:0 24px 70px rgba(0,0,0,.28);--shadow-soft:0 10px 30px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-width:320px;color:var(--ink);background:var(--bg);font-family:"Cairo","DM Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
html[dir="ltr"] body{font-family:"DM Sans","Cairo",ui-sans-serif,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(255,107,95,.34);outline-offset:2px}
.app-shell{min-height:100vh;position:relative;overflow-x:hidden}
.app-shell::before,.app-shell::after{content:"";position:fixed;z-index:-1;width:44vw;height:44vw;border-radius:50%;filter:blur(2px);opacity:.42;pointer-events:none}
.app-shell::before{top:-18vw;inset-inline-end:-10vw;background:radial-gradient(circle,var(--lavender),transparent 67%)}
.app-shell::after{bottom:-18vw;inset-inline-start:-13vw;background:radial-gradient(circle,var(--mint),transparent 66%)}
.ico{width:19px;height:19px;display:inline-block;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.fill{fill:currentColor;stroke:none}
h1,h2,h3,.wordmark,.page-kicker,.page-title{font-family:"Space Grotesk","Cairo",sans-serif}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .wordmark,html[dir="rtl"] .page-kicker,html[dir="rtl"] .page-title{font-family:"Cairo","Space Grotesk",sans-serif}
/* Onboarding */
.onboarding{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,540px);align-items:center;gap:clamp(38px,7vw,120px);padding:clamp(28px,6vw,90px);max-width:1440px;margin:0 auto}
.onboarding-visual{min-height:min(660px,76vh);position:relative;display:flex;align-items:center;justify-content:center}
.visual-orbit{width:min(510px,40vw);aspect-ratio:1;border:1px solid rgba(255,107,95,.25);border-radius:50%;position:relative;animation:orbitFloat 7s ease-in-out infinite}
.visual-orbit::before,.visual-orbit::after{content:"";position:absolute;border-radius:50%}
.visual-orbit::before{inset:10%;border:1px dashed rgba(15,23,42,.15)}
[data-theme="dark"] .visual-orbit::before{border-color:rgba(255,255,255,.16)}
.visual-orbit::after{width:17px;height:17px;inset-inline-end:10%;top:13%;background:var(--signal);box-shadow:0 0 0 9px var(--signal-wash),0 0 30px rgba(255,107,95,.45)}
.orbit-card{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);padding:15px 16px;backdrop-filter:blur(18px);display:flex;gap:11px;align-items:center;min-width:170px}
.orbit-card strong{display:block;font-size:13px}
.orbit-card span{color:var(--muted);font-size:11px;display:block;margin-top:3px}
.orbit-card.one{top:12%;inset-inline-start:-3%;transform:rotate(-7deg)}
.orbit-card.two{bottom:17%;inset-inline-end:-1%;transform:rotate(6deg)}
.orbit-card.three{bottom:3%;inset-inline-start:13%;transform:rotate(-3deg)}
.orbit-avatar{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--ink);background:linear-gradient(135deg,var(--mint),var(--lavender))}
.orbit-center{position:absolute;inset:28%;border-radius:42%;background:linear-gradient(145deg,var(--surface-solid),var(--bg-soft));border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.logo-mark{width:66px;height:66px;border-radius:24px;display:grid;place-items:center;color:var(--surface-solid);background:var(--signal);box-shadow:0 16px 34px rgba(255,107,95,.28);position:relative}
.logo-mark::after{content:"";position:absolute;inset:12px;border:2px solid rgba(255,255,255,.66);border-radius:50%}
.logo-mark .logo-dot{width:9px;height:9px;background:#fff;border-radius:50%;position:relative;z-index:1}
.orbit-center b{font-family:"Space Grotesk";letter-spacing:-.06em;font-size:28px;margin-top:15px}
.orbit-center small{color:var(--muted);margin-top:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.onboarding-copy{max-width:520px}
.mini-brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.mini-brand .tiny-mark{width:25px;height:25px;background:var(--signal);border-radius:9px;display:grid;place-items:center;position:relative}
.tiny-mark::after{content:"";width:8px;height:8px;border:1.5px solid #fff;border-radius:50%}
.onboarding h1{margin:24px 0 16px;font-size:clamp(40px,5.6vw,74px);line-height:1.02;letter-spacing:-.04em;max-width:560px;font-weight:700}
.onboarding h1 em{color:var(--signal);font-style:normal}
.lede{color:var(--muted);line-height:1.7;max-width:450px;font-size:15px;margin:0 0 28px}
.lang-toggle{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:20px}
.lang-toggle button{padding:7px 14px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted)}
.lang-toggle button.active{background:var(--signal);color:#fff}
.auth-card{max-width:470px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:var(--shadow);padding:clamp(22px,4vw,32px);backdrop-filter:blur(18px)}
.auth-card h2{margin:0;font-size:20px;letter-spacing:-.02em}
.auth-card .sub{color:var(--muted);font-size:12px;margin:8px 0 22px;line-height:1.5}
.field-label{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;margin:16px 0 9px}
.input-wrap{position:relative;display:flex;align-items:center;background:var(--surface-strong);border:1px solid var(--line);border-radius:14px;height:52px;transition:border .2s,box-shadow .2s}
.input-wrap:focus-within{border-color:rgba(255,107,95,.65);box-shadow:0 0 0 4px var(--signal-wash)}
.input-wrap.invalid{border-color:var(--signal);animation:shake .36s ease both}
.input-wrap input{min-width:0;width:100%;height:100%;border:0;outline:0;background:transparent;color:var(--ink);padding:0 15px}
.input-wrap .prefix{padding-inline-start:17px;color:var(--muted);font-weight:700}
.input-wrap .fixed-at{padding-inline-start:17px;color:var(--signal);font-family:"Space Grotesk";font-weight:700;font-size:17px}
.input-wrap .username-input{padding-inline-start:5px}
.country-hint{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:8px}
.country-hint .dot{width:6px;height:6px;border-radius:50%;background:var(--mint)}
.auth-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}
.legal-note{color:var(--muted-2);font-size:10px;line-height:1.45;max-width:210px}
.btn{min-height:44px;padding:0 16px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:13px;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,color .16s ease}
.btn:active{transform:scale(.96)}
.btn-primary{color:#fff;background:var(--signal);box-shadow:0 12px 23px rgba(255,107,95,.25)}
.btn-primary:hover{background:var(--signal-deep);box-shadow:0 15px 28px rgba(255,107,95,.32);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);background:var(--signal-wash)}
.btn-soft{background:var(--signal-wash);color:var(--signal-deep)}
.btn-danger{background:rgba(237,80,72,.12);color:#ed5048}
.btn-danger:hover{background:#ed5048;color:#fff}
.btn-full{width:100%}
.btn-sm{min-height:36px;padding:0 12px;font-size:12px;border-radius:11px}
/* App layout */
.app-layout{min-height:100vh;width:100%;display:grid;grid-template-columns:240px minmax(0,1fr)}
.sidebar{padding:26px 18px;display:flex;flex-direction:column;border-inline-end:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto}
.wordmark{display:flex;align-items:center;gap:11px;font-weight:700;font-size:23px;letter-spacing:-.04em;padding:4px 9px}
.wordmark .brand-orbit{width:28px;height:28px;border-radius:10px;background:var(--signal);position:relative;display:grid;place-items:center}
.brand-orbit::after{content:"";width:12px;height:12px;border:1.5px solid #fff;border-radius:50%}
.sidebar-nav{margin-top:50px;display:grid;gap:5px}
.nav-item{border-radius:13px;min-height:46px;padding:0 13px;display:flex;align-items:center;gap:13px;color:var(--muted);background:transparent;text-align:start;font-size:13px;font-weight:600;transition:.16s ease;position:relative;width:100%}
.nav-item:hover{color:var(--ink);background:var(--surface-strong)}
.nav-item.active{color:var(--ink);background:var(--surface-strong);box-shadow:var(--shadow-soft)}
.nav-item.active .nav-icon{color:var(--signal)}
.nav-icon{width:20px;display:grid;place-items:center}
.nav-badge{margin-inline-start:auto;padding:1px 7px;border-radius:99px;background:var(--signal);color:#fff;font-size:10px;font-weight:800;min-width:19px;text-align:center}
.sidebar-spacer{flex:1}
.profile-chip{display:flex;align-items:center;gap:10px;padding:11px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:12px;transition:.15s ease}
.profile-chip:hover{background:var(--bg-soft)}
.profile-chip div{min-width:0;flex:1}
.profile-chip strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-chip span{color:var(--muted);font-size:10px}
.avatar{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mint),var(--lavender));color:#1f2937;font-size:11px;font-weight:800;text-transform:uppercase;flex:0 0 auto;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:72px;height:72px;border-radius:25px;font-size:20px}
.avatar.sm{width:28px;height:28px;border-radius:9px;font-size:10px}
.avatar.xs{width:22px;height:22px;border-radius:8px;font-size:8px}
.main-pane{min-width:0;padding:26px clamp(16px,4.5vw,60px) 100px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;max-width:1120px;margin:0 auto}
.page-kicker{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:10px}
.page-title{margin:6px 0 0;font-size:clamp(24px,3.6vw,34px);letter-spacing:-.04em;font-weight:700}
.page-title .signal{color:var(--signal)}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--muted);transition:.16s ease;position:relative}
.icon-btn:hover{color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow-soft)}
.icon-btn.has-dot::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;inset-inline-end:7px;top:6px;background:var(--signal);border:2px solid var(--bg)}
.search-bar{max-width:1120px;margin:26px auto 20px;display:flex;align-items:center;gap:11px;height:50px;padding:0 16px;border:1px solid var(--line);background:var(--surface);border-radius:16px;box-shadow:var(--shadow-soft)}
.search-bar .ico{color:var(--muted);width:18px}
.search-bar input{border:0;outline:0;flex:1;min-width:0;color:var(--ink);background:transparent;font-size:14px}
.search-bar input::placeholder{color:var(--muted-2)}
.content-grid{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
.feed-column{min-width:0}
.side-column{display:grid;gap:14px;position:sticky;top:22px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);backdrop-filter:blur(16px)}
/* Stories */
.stories-bar{max-width:1120px;margin:0 auto 16px;display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.stories-bar::-webkit-scrollbar{display:none}
.story-bubble{flex:0 0 auto;display:grid;justify-items:center;gap:6px;width:74px;padding:2px;border-radius:16px;transition:.15s ease}
.story-bubble:hover{background:var(--bg-soft)}
.story-ring{width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(from 180deg,#ed5048,#ff6b5f,#b99cff,#8d78ff,#ed5048)}
.story-ring.seen{background:linear-gradient(135deg,var(--line),var(--line))}
.story-ring .avatar{width:100%;height:100%;border-radius:50%;border:3px solid var(--surface-solid);font-size:16px}
.story-ring.add{background:linear-gradient(135deg,var(--mint),var(--lavender));position:relative}
.story-ring.add::after{content:"+";position:absolute;inset-inline-end:0;bottom:0;width:22px;height:22px;border-radius:50%;background:var(--signal);color:#fff;display:grid;place-items:center;font-weight:700;border:3px solid var(--surface-solid);font-size:15px;line-height:1}
.story-bubble small{font-size:10px;color:var(--muted);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.story-bubble.me small{color:var(--ink);font-weight:700}
/* Posts */
.welcome-card{padding:22px;background:linear-gradient(135deg,var(--surface),rgba(255,107,95,.08));position:relative;overflow:hidden}
.welcome-card::after{content:"";width:160px;height:160px;border-radius:50%;border:1px solid var(--signal-wash);position:absolute;inset-inline-end:-48px;top:-47px}
.welcome-card h2{margin:0;font-size:19px;letter-spacing:-.02em}
.welcome-card p{color:var(--muted);font-size:13px;line-height:1.6;max-width:440px;margin:8px 0 15px}
.quick-create{display:flex;align-items:center;gap:12px;padding:13px;border:1px dashed rgba(255,107,95,.38);border-radius:14px;color:var(--muted);font-size:12px;cursor:pointer;transition:.16s ease}
.quick-create:hover{background:var(--signal-wash);color:var(--ink)}
.quick-create .plus{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;color:#fff;background:var(--signal)}
.section-row{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}
.section-row h3{font-size:14px;margin:0;letter-spacing:-.01em}
.section-row span{color:var(--muted);font-size:11px}
.post-card{overflow:hidden;margin-bottom:14px;position:relative}
.post-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 10px;position:relative}
.post-author{display:flex;gap:10px;align-items:center;min-width:0}
.post-author>div{min-width:0}
.post-author strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post-author span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.post-menu{color:var(--muted);background:transparent;padding:6px;border-radius:9px;transition:.15s ease;display:grid;place-items:center}
.post-menu:hover{background:var(--bg-soft);color:var(--ink)}
.post-dropdown{position:absolute;inset-inline-end:0;top:calc(100% + 6px);z-index:60;min-width:200px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--surface-solid);box-shadow:var(--shadow);animation:modalIn .15s ease both}
.post-body{padding:3px 17px 18px}
.post-body p{margin:0;line-height:1.65;font-size:14px;white-space:pre-wrap;word-break:break-word}
.post-body p .mention{color:var(--signal);font-weight:700;text-decoration:none;cursor:pointer}
.post-body p .hashtag{color:#5d8eff;font-weight:700;text-decoration:none;cursor:pointer}
.post-actions{display:flex;align-items:center;gap:5px;border-top:1px solid var(--line);padding:9px 15px}
.action-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--muted);border-radius:9px;padding:7px 9px;font-size:11px;transition:.16s ease}
.action-btn:hover{color:var(--ink);background:var(--bg-soft)}
.action-btn.liked{color:var(--signal)}
.action-btn.saved{color:#5d8eff}
.action-btn .ico{width:17px;height:17px}
.empty-state{border:1px dashed var(--line);border-radius:var(--radius-lg);text-align:center;padding:42px 22px;color:var(--muted);background:rgba(255,255,255,.22)}
.empty-state .empty-icon{width:50px;height:50px;margin:0 auto 14px;display:grid;place-items:center;border-radius:17px;color:var(--signal);background:var(--signal-wash)}
.empty-state h3{color:var(--ink);margin:0 0 8px;font-size:16px}
.empty-state p{font-size:12px;line-height:1.6;max-width:300px;margin:0 auto}
.side-card{padding:16px}
.side-card h3{font-size:12px;margin:0 0 13px;letter-spacing:0}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--bg-soft);border-radius:12px;padding:11px}
.stat strong{display:block;font-family:"Space Grotesk";font-size:20px;letter-spacing:-.03em}
.stat span{font-size:10px;color:var(--muted)}
.status-row{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px;line-height:1.45}
.status-dot{width:7px;height:7px;border-radius:50%;background:#53c58b;box-shadow:0 0 0 4px rgba(83,197,139,.13);flex:0 0 auto}
/* Suggested users */
.suggest-list{display:grid;gap:8px}
.suggest-item{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;transition:.15s ease}
.suggest-item:hover{background:var(--bg-soft)}
.suggest-item>div{flex:1;min-width:0}
.suggest-item strong{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggest-item span{font-size:10px;color:var(--muted);display:block}
/* Pages */
.page-wrap{max-width:1120px;margin:24px auto 0}
.panel{padding:20px;margin-bottom:14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px;flex-wrap:wrap}
.panel-head h2{margin:0;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.panel-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
/* Messages */
.messages-layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:640px;overflow:hidden}
.thread-list{border-inline-end:1px solid var(--line);padding:14px;overflow-y:auto;max-height:78vh}
.thread-list h3{font-size:11px;margin:4px 6px 10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.thread-list .thread-tabs{display:flex;gap:4px;margin-bottom:10px;background:var(--bg-soft);padding:3px;border-radius:11px}
.thread-list .thread-tabs button{flex:1;padding:7px 6px;border-radius:8px;font-size:11px;font-weight:700;color:var(--muted)}
.thread-list .thread-tabs button.active{background:var(--surface-solid);color:var(--ink);box-shadow:var(--shadow-soft)}
.thread{width:100%;padding:10px 9px;border-radius:13px;display:flex;align-items:center;gap:10px;text-align:start;background:transparent;transition:.16s ease;margin-bottom:3px}
.thread:hover,.thread.active{background:var(--bg-soft)}
.thread>div:not(.avatar){min-width:0;flex:1}
.thread strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread span{display:block;font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.thread-time{font-size:9px;color:var(--muted-2)}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--signal)}
.verified-badge{display:inline-grid;place-items:center;width:16px;height:16px;margin-inline-start:4px;border-radius:50%;background:#2f80ed;color:#fff;font:800 10px Arial;vertical-align:middle;flex:0 0 auto}
.chat{min-width:0;display:flex;flex-direction:column;height:78vh}
.chat-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.chat-head .chat-person{flex:1;min-width:0;cursor:pointer}
.chat-head strong{font-size:13px;display:flex;align-items:center;gap:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head span{display:block;color:var(--muted);font-size:10px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-info-button{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface-strong);color:var(--muted);transition:.16s ease;flex:0 0 auto}
.chat-info-button:hover{color:var(--signal);border-color:var(--signal)}
.call-button{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(111,136,255,.25);border-radius:12px;background:#eef2ff;color:#5269de;transition:.15s ease;flex:0 0 auto}
[data-theme="dark"] .call-button{background:rgba(82,105,222,.15);color:#8ca0ff}
.call-button:hover{transform:translateY(-2px) rotate(-6deg);box-shadow:0 8px 18px rgba(82,105,222,.2)}
.call-button:active{transform:scale(.88)}
.call-button .ico{width:19px;height:19px}
.chat-body{flex:1;padding:18px;overflow-y:auto;background:radial-gradient(circle at 80% 10%,var(--signal-wash),transparent 30%);scroll-behavior:smooth}
.bubble-row{display:flex;gap:8px;margin-bottom:9px;align-items:flex-end}
.bubble-row.me{flex-direction:row-reverse}
.bubble{max-width:72%;padding:9px 13px;border-radius:16px;font-size:13px;line-height:1.55;word-break:break-word;position:relative;box-shadow:0 3px 10px rgba(31,41,61,.05)}
.bubble.them{background:var(--surface-solid);border:1px solid var(--line);border-end-start-radius:5px}
.bubble.me{background:var(--signal);color:#fff;border-end-end-radius:5px}
.bubble .bubble-time{display:block;font-size:9px;margin-top:5px;opacity:.72}
.bubble .bubble-edited{font-size:9px;opacity:.72;margin-inline-start:5px}
.bubble.deleted{font-style:italic;opacity:.72}
.bubble-menu-btn{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:var(--muted);background:transparent;opacity:.4;flex:0 0 auto}
.bubble-menu-btn:hover{background:var(--bg-soft);opacity:1}
.bubble-menu-btn .ico{width:15px;height:15px}
.chat-composer{padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;background:var(--surface-solid)}
.chat-composer input,.chat-composer textarea{min-width:0;flex:1;height:42px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:var(--bg-soft);color:var(--ink);outline:0;font-size:13px;resize:none}
.chat-composer input:focus,.chat-composer textarea:focus{border-color:var(--signal)}
.composer-tool{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:11px;background:var(--bg-soft);color:var(--muted);transition:.15s ease;flex:0 0 auto}
.composer-tool:hover{color:var(--signal);transform:translateY(-2px)}
.composer-tool:active{transform:scale(.88)}
.composer-tool.recording{background:var(--signal);color:#fff;animation:pulseRecord 1s ease-in-out infinite}
.composer-tool .ico{width:18px;height:18px}
.composer-send{width:42px;height:42px;min-width:42px;padding:0}
.message-empty{min-width:0;flex:1;display:grid;place-items:center;align-content:center;text-align:center;padding:35px;color:var(--muted)}
.message-empty h2{color:var(--ink);font-size:17px;margin:16px 0 6px}
.message-empty p{font-size:12px;margin:0;max-width:260px;line-height:1.55}
.nothing-icon{width:66px;height:66px;border-radius:23px;display:grid;place-items:center;color:var(--signal);background:var(--signal-wash);box-shadow:0 0 0 12px rgba(255,107,95,.035)}
.nothing-icon .ico{width:27px;height:27px}
.support-empty{height:100%;min-height:380px;display:grid;place-items:center;align-content:center;text-align:center;color:var(--muted)}
.support-empty h3{color:var(--ink);font-size:15px;margin:14px 0 6px}
.support-empty p{font-size:11px;max-width:250px;line-height:1.5;margin:0 auto}
/* Voice */
.audio-card{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border-radius:14px;color:var(--signal-deep);background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28)}
.bubble.them .audio-card{background:var(--bg-soft);border-color:var(--line)}
.audio-play{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--signal);box-shadow:0 6px 14px rgba(255,107,95,.23);transition:.15s ease}
.audio-play:active{transform:scale(.88)}
.play-glyph{font-size:12px;line-height:1;margin-inline-start:2px}
.audio-track{height:6px;flex:1;overflow:hidden;border-radius:99px;background:rgba(120,125,145,.22);min-width:60px}
.audio-fill{display:block;width:0;height:100%;border-radius:inherit;background:currentColor;opacity:.75;transition:width .1s linear}
.audio-duration{font-size:10px;opacity:.75;min-width:30px;text-align:center}
/* Profile */
.profile-hero{display:flex;align-items:center;gap:18px;padding:24px;flex-wrap:wrap}
.profile-hero h2{margin:0;font-size:22px;letter-spacing:-.03em}
.profile-hero p{margin:5px 0 0;color:var(--muted);font-size:12px}
.profile-stats{display:flex;gap:22px;text-align:center;margin-inline-start:auto}
.profile-stats button{background:transparent;padding:0}
.profile-stats strong{display:block;font-family:"Space Grotesk";font-size:20px}
.profile-stats span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.profile-bio{width:100%;margin-top:12px;color:var(--muted);font-size:12.5px;line-height:1.55}
.profile-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* Settings */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.setting-row{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding:12px 0;position:relative;z-index:3;overflow:visible}
.setting-row:first-of-type{border-top:0}
.setting-copy strong{display:block;font-size:12.5px}
.setting-copy span{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:3px}
.toggle{width:44px;height:25px;background:var(--muted-2);border-radius:99px;padding:3px;transition:.2s ease;position:relative;flex:0 0 auto}
.toggle::after{content:"";width:19px;height:19px;display:block;background:#fff;border-radius:50%;transition:.2s ease}
.toggle.on{background:var(--signal)}
.toggle.on::after{transform:translateX(19px)}
html[dir="rtl"] .toggle.on::after{transform:translateX(-19px)}
.device-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.device-row:first-of-type{border-top:0}
.device-info{flex:1;min-width:0}
.device-info strong{font-size:12px;display:block}
.device-info span{color:var(--muted);font-size:10px;display:block;margin-top:2px}
.current-tag{color:#4bbf85;font-size:9px;font-weight:700}
/* Custom select */
.custom-select{position:relative;min-width:150px;z-index:20}
.custom-select-button{height:40px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;border:1px solid var(--line);border-radius:11px;color:var(--ink);background:var(--surface-strong);font-size:12px;transition:.16s ease}
.custom-select-button:hover,.custom-select.open .custom-select-button{border-color:var(--signal);box-shadow:0 0 0 4px var(--signal-wash)}
.custom-select-button .ico{width:14px;height:14px;transition:.2s ease}
html[dir="rtl"] .custom-select-button .ico{transform:scaleX(-1)}
.custom-select.open .custom-select-button .ico{transform:rotate(90deg)}
html[dir="rtl"] .custom-select.open .custom-select-button .ico{transform:rotate(-90deg)}
.custom-select-menu{position:absolute;z-index:100;inset-inline-end:0;top:46px;min-width:180px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--surface-solid);box-shadow:var(--shadow);animation:modalIn .15s ease both;max-height:220px;overflow:auto}
.custom-select-menu button{width:100%;height:38px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:9px;background:transparent;color:var(--ink);font-size:12px;text-align:start}
.custom-select-menu button:hover{background:var(--signal-wash)}
.select-dot{width:9px;height:9px;border:1.5px solid var(--muted-2);border-radius:50%}
.select-dot.selected{border:2px solid var(--signal);background:var(--signal);box-shadow:inset 0 0 0 2px var(--surface-solid)}
/* Notifications page */
.notif-row{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;transition:.16s ease;border-bottom:1px solid var(--line)}
.notif-row:last-child{border-bottom:0}
.notif-row:hover{background:var(--bg-soft)}
.notif-row.unread{background:var(--signal-wash)}
.notif-row.unread:hover{background:rgba(255,107,95,.17)}
.notif-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--bg-soft);color:var(--signal);flex:0 0 auto}
.notif-icon.like{background:rgba(255,107,95,.14);color:#ed5048}
.notif-icon.follow{background:rgba(93,142,255,.14);color:#5d8eff}
.notif-icon.comment{background:rgba(184,232,218,.6);color:#36b89c}
.notif-icon.message{background:rgba(185,156,255,.18);color:#8d78ff}
.notif-body{flex:1;min-width:0}
.notif-body strong{font-size:12.5px;display:block}
.notif-body p{font-size:12px;color:var(--muted);margin:3px 0 0;line-height:1.45;word-break:break-word}
.notif-time{font-size:10px;color:var(--muted-2);flex:0 0 auto;align-self:flex-start}
/* Modal */
.overlay{position:fixed;inset:0;z-index:70;padding:16px;display:grid;place-items:center;background:rgba(11,15,25,.5);backdrop-filter:blur(8px);animation:fadeIn .18s ease both}
.modal{width:min(100%,520px);max-height:min(760px,92vh);overflow:auto;padding:22px;background:var(--surface-solid);border:1px solid var(--line);border-radius:25px;box-shadow:var(--shadow);animation:modalIn .22s ease both}
.modal.small{width:min(100%,400px)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.modal-head h2{margin:0;font-size:18px;letter-spacing:-.02em}
.modal-head p{color:var(--muted);font-size:12px;line-height:1.5;margin:5px 0 0}
.close-btn{width:34px;height:34px;border-radius:11px;color:var(--muted);background:var(--bg-soft);display:grid;place-items:center;flex:0 0 auto;transition:.15s ease}
.close-btn:hover{background:var(--signal-wash);color:var(--signal)}
.textarea{width:100%;min-height:130px;padding:13px;border:1px solid var(--line);border-radius:14px;resize:vertical;outline:0;background:var(--surface-strong);color:var(--ink);line-height:1.6;font-size:14px;font-family:inherit}
.textarea:focus{border-color:rgba(255,107,95,.65);box-shadow:0 0 0 4px var(--signal-wash)}
.modal-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
/* Emoji picker */
.emoji-anchor{position:relative}
.emoji-pop{position:absolute;z-index:220;inset-inline-start:0;bottom:calc(100% + 10px);width:238px;display:flex;flex-wrap:wrap;gap:4px;padding:9px;border:1px solid var(--line);border-radius:16px;background:var(--surface-solid);box-shadow:var(--shadow);animation:modalIn .16s ease both}
.emoji-item{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;font-size:19px;line-height:1;cursor:pointer;transition:transform .14s ease,background .14s ease}
.emoji-item:hover{background:var(--signal-wash);transform:translateY(-2px) scale(1.1)}
.emoji-item:active{transform:scale(.85)}
/* Stickers */
.sticker-pop{position:absolute;z-index:220;inset-inline-start:0;bottom:calc(100% + 10px);width:280px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--surface-solid);box-shadow:var(--shadow);animation:modalIn .16s ease both;max-height:280px;overflow:auto}
.sticker-item{width:100%;aspect-ratio:1;display:grid;place-items:center;border:0;border-radius:11px;background:var(--bg-soft);font-size:26px;cursor:pointer;transition:transform .14s ease,background .14s ease}
.sticker-item:hover{background:var(--signal-wash);transform:scale(1.08)}
/* Comments */
.comment{padding:11px 12px;border-radius:12px;background:var(--bg-soft);font-size:13px;line-height:1.5;margin-bottom:8px;cursor:pointer;transition:.15s ease}
.comment:hover{background:var(--bg-soft);box-shadow:var(--shadow-soft)}
.comment .comment-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.comment .comment-top>span{font-size:10px;color:var(--muted)}
.comment-like{display:inline-flex;gap:4px;align-items:center;color:var(--muted);background:transparent;font-size:10px}
.comment-like.liked{color:var(--signal)}
.comment-like .ico{width:13px;height:13px}
.comment-replies{margin-top:8px;padding-inline-start:12px;border-inline-start:2px solid var(--line);display:grid;gap:6px}
.comment-reply-item{padding:8px 10px;border-radius:10px;background:var(--surface-solid);font-size:12px}
.comment-reply-item span{display:block;font-size:9px;color:var(--muted);margin-bottom:3px}
.comment-form{display:flex;gap:7px;margin-top:6px}
.comment-form input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:var(--surface-strong);color:var(--ink);outline:0;font-size:12px}
.comment-form input:focus{border-color:var(--signal)}
.attachment-bar{display:flex;align-items:center;gap:6px;margin:8px 0;flex-wrap:wrap}
.mini-action{min-height:34px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;background:var(--bg-soft);color:var(--muted);font-size:11px;font-weight:700;transition:.15s ease;border:0;cursor:pointer}
.mini-action:hover{background:var(--signal-wash);color:var(--signal)}
.mini-action .ico{width:15px;height:15px}
/* Fullscreen */
.fullscreen-modal{padding:0;background:rgba(9,13,24,.72);backdrop-filter:blur(16px)}
.fullscreen-modal .modal{width:min(100vw,1180px);height:100vh;max-height:none;border:0;border-radius:0;padding:clamp(20px,4vw,56px) clamp(16px,6vw,100px);background:var(--surface-solid);box-shadow:none;display:flex;flex-direction:column}
.comments-list{flex:1;overflow:auto;max-width:820px;width:100%;margin:0 auto;padding:10px 0 20px}
.comments-modal .modal-head{width:100%;max-width:820px;margin-inline:auto}
.comment-composer{max-width:820px;width:100%;margin:auto auto 0;display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.comment-composer .comment-form{flex:1;min-width:200px}
.nothing-state{flex:1;display:grid;place-items:center;align-content:center;text-align:center;color:var(--muted);padding:40px 20px}
.nothing-state h3{color:var(--ink);font-size:20px;margin:16px 0 8px;letter-spacing:.02em}
.nothing-state p{margin:0;font-size:12px;max-width:320px;line-height:1.55}
/* Bottom sheet */
.action-overlay{padding:0;align-items:end;background:rgba(10,14,25,.4);backdrop-filter:blur(14px)}
.bottom-sheet{width:min(100%,620px);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:12px 20px 24px;background:var(--surface-solid);box-shadow:0 -20px 70px rgba(10,14,25,.22);animation:sheetIn .24s ease both}
.sheet-grabber{width:42px;height:4px;border-radius:99px;background:var(--muted-2);opacity:.55;margin:0 auto 20px}
.bottom-sheet h3{margin:0;font-size:17px;letter-spacing:-.02em}
.sheet-caption{color:var(--muted);font-size:12px;margin:5px 0 16px}
.sheet-action{width:100%;display:flex;align-items:center;gap:13px;min-height:50px;padding:0 14px;background:transparent;border-top:1px solid var(--line);color:var(--ink);text-align:start;font-size:13px;font-weight:600;cursor:pointer;transition:.15s ease}
.sheet-action:first-of-type{border-top:0}
.sheet-action:hover{background:var(--bg-soft)}
.sheet-action .ico{color:var(--signal)}
.sheet-action span{margin-inline-start:auto;color:var(--muted)}
.sheet-action.danger{color:var(--signal-deep)}
.sheet-action.danger .ico{color:var(--signal-deep)}
/* Toast */
.toast-region{position:fixed;z-index:200;inset-inline-end:16px;bottom:16px;display:grid;gap:8px;width:min(330px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;color:#fff;background:linear-gradient(120deg,#202742,#31385e);border:1px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:0 14px 28px rgba(22,28,52,.28);font-size:12px;animation:toastIn .22s ease both}
.toast .ico{color:#bda7ff;width:16px;height:16px;margin-top:1px}
.toast.error .ico{color:#ff8e85}
/* Camera */
.camera-modal{padding:0 !important;background:#050810 !important;max-height:100vh !important;border-radius:24px !important;overflow:hidden;display:flex;flex-direction:column;width:min(100%,560px)}
.camera-stage{position:relative;flex:1;min-height:340px;background:#000;display:grid;place-items:center;overflow:hidden}
.camera-stage video{width:100%;height:100%;max-height:70vh;object-fit:contain;background:#000;display:block}
.camera-stage video.mirror{transform:scaleX(-1)}
.camera-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:5}
.camera-flash.on{opacity:.85}
.camera-controls{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;background:linear-gradient(0deg,#0a0f1c,#0a0f1ce0)}
.camera-controls .cam-tool{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;transition:.15s ease}
.camera-controls .cam-tool:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.camera-controls .cam-tool:active{transform:scale(.88)}
.camera-shutter{width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.35);transition:.15s ease}
.camera-shutter:active{transform:scale(.86)}
.camera-hint{padding:10px 18px;color:#94a1c0;font-size:12px;text-align:center;background:#0a0f1c;display:flex;align-items:center;justify-content:center;gap:8px}
/* Story viewer */
.story-viewer{position:fixed;inset:0;z-index:150;background:#050810;display:grid;place-items:center;animation:fadeIn .2s ease both}
.story-viewer .story-stage{position:relative;width:min(100vw,480px);height:min(100vh,880px);background:#000;overflow:hidden;border-radius:0}
@media(min-width:520px){.story-viewer .story-stage{border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.5)}}
.story-viewer .story-stage img,.story-viewer .story-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.story-progress{position:absolute;top:12px;inset-inline:12px;display:flex;gap:4px;z-index:5}
.story-progress i{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden}
.story-progress i.done{background:#fff}
.story-progress i span{display:block;height:100%;background:#fff;width:0}
.story-head{position:absolute;top:26px;inset-inline:12px;display:flex;align-items:center;gap:10px;z-index:5;color:#fff}
.story-head strong{font-size:13px}
.story-head span{font-size:11px;opacity:.8;display:block}
.story-close{position:absolute;top:22px;inset-inline-end:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;z-index:6}
.story-nav{position:absolute;top:0;bottom:0;width:32%;z-index:4}
.story-nav.prev{inset-inline-start:0}
.story-nav.next{inset-inline-end:0}
.story-caption{position:absolute;bottom:22px;inset-inline:16px;color:#fff;font-size:14px;text-shadow:0 2px 10px rgba(0,0,0,.6);z-index:5;text-align:center}
/* Search results */
.search-tabs{display:flex;gap:4px;padding:4px;background:var(--bg-soft);border-radius:12px;margin-bottom:14px}
.search-tabs button{flex:1;padding:9px 8px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted)}
.search-tabs button.active{background:var(--surface-solid);color:var(--ink);box-shadow:var(--shadow-soft)}
.user-card{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;transition:.15s ease}
.user-card:hover{box-shadow:var(--shadow-soft);transform:translateY(-2px)}
.user-card>div:nth-child(2){flex:1;min-width:0}
.user-card strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-card span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
/* Call modal */
.call-modal{width:min(100%,420px);padding:22px 20px 18px;background:linear-gradient(160deg,#1a2238,#0d1220);border:1px solid rgba(255,255,255,.06);color:#fff;text-align:center;border-radius:25px}
.call-modal.light{background:linear-gradient(160deg,#ffffff,#eef2ff);color:var(--ink);border:1px solid var(--line)}
.call-stage{position:relative;width:100%;aspect-ratio:3/4;max-height:54vh;border-radius:22px;overflow:hidden;background:#0a0f1c;display:grid;place-items:center;margin:0 0 14px}
.call-modal.light .call-stage{background:#e6ecff}
.call-stage .call-avatar{position:relative;z-index:1;width:110px;height:110px;border-radius:36px;display:grid;place-items:center;background:linear-gradient(135deg,#b99cff,#5269de);color:#fff;font:800 34px "Space Grotesk";box-shadow:0 0 0 12px rgba(185,156,255,.12)}
.call-stage .call-self{position:absolute;inset-inline-end:10px;top:10px;width:100px;height:130px;border-radius:14px;background:#0a0f1c;border:1px solid rgba(255,255,255,.14);overflow:hidden;z-index:3}
.call-stage .call-self video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.call-stage.sharing .call-self{width:120px;height:85px}
.call-main-share{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:2}
.call-timer{margin-top:10px;font-family:"Space Grotesk";font-size:22px;letter-spacing:.06em}
.call-status{color:#a8b0c0;font-size:12px;margin-top:5px}
.call-modal.light .call-status{color:var(--muted)}
.call-ripples{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.call-ripples i{position:absolute;border-radius:50%;border:2px solid rgba(185,156,255,.35);animation:callRipple 1.8s ease-out infinite}
.call-ripples i:nth-child(2){animation-delay:.6s}
.call-ripples i:nth-child(3){animation-delay:1.2s}
.call-actions{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.call-action{width:56px;height:56px;display:grid;place-items:center;border:0;border-radius:18px;background:rgba(255,255,255,.1);color:#fff;transition:.15s ease}
.call-modal.light .call-action{background:rgba(15,23,42,.06);color:var(--ink)}
.call-action:hover{transform:translateY(-3px)}
.call-action:active{transform:scale(.86)}
.call-action.active{background:#fff;color:#0a0f1c}
.call-modal.light .call-action.active{background:var(--signal);color:#fff}
.call-action.end{background:#ed5048;color:#fff;width:70px}
.call-action .ico{width:22px;height:22px}
.call-action small{display:block;font-size:9px;margin-top:2px;letter-spacing:.02em}
.share-badge{position:absolute;inset-inline-start:12px;top:12px;z-index:4;padding:6px 11px;border-radius:11px;background:rgba(255,107,95,.92);color:#fff;font-size:10px;font-weight:800;letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px}
.share-badge .ico{width:13px;height:13px}
/* Diamonds / Max */
.diamond-svg{width:26px;height:26px;color:#b99cff;stroke-width:1.6;filter:drop-shadow(0 5px 8px rgba(185,156,255,.22))}
.wallet-balance{padding:8px 12px;border-radius:12px;color:#241743;background:#e8ddff;font:700 15px "Space Grotesk"}
[data-theme="dark"] .wallet-balance{color:#e8ddff;background:rgba(185,156,255,.2)}
.diamond-entry{width:100%;display:flex;align-items:center;gap:13px;margin-top:14px;padding:14px;border:1px solid rgba(185,156,255,.25);border-radius:16px;background:linear-gradient(105deg,rgba(185,156,255,.16),rgba(255,255,255,.03));color:var(--ink);text-align:start;transition:.18s ease;cursor:pointer}
.diamond-entry:hover{border-color:#b99cff;transform:translateY(-2px);box-shadow:0 12px 24px rgba(185,156,255,.12)}
.diamond-entry>span:nth-child(2){display:grid;gap:3px;flex:1}
.diamond-entry small{color:var(--muted);font-size:11px}
.diamond-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.diamond-pack{min-height:100px;display:grid;place-items:center;align-content:center;gap:5px;border:1px solid var(--line);border-radius:18px;background:var(--surface-strong);color:var(--ink);transition:.18s ease;padding:12px;cursor:pointer}
.diamond-pack:hover{transform:translateY(-2px);border-color:#b99cff;box-shadow:0 14px 24px rgba(185,156,255,.12)}
.diamond-pack.selected{background:linear-gradient(145deg,rgba(185,156,255,.36),rgba(126,104,221,.16));border-color:#b99cff;box-shadow:0 0 0 4px rgba(185,156,255,.2),0 10px 24px rgba(185,156,255,.15)}
.diamond-pack strong{font:700 20px "Space Grotesk"}
.diamond-pack small{font-size:10px;color:var(--muted)}
.visa-strip{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px;padding:15px;border-radius:16px;color:#fff;background:linear-gradient(105deg,#151a42,#5167de)}
.visa-strip span:first-child{font:700 20px Arial;font-style:italic;letter-spacing:2px}
.checkout-modal label{display:grid;gap:6px;margin:11px 0;color:var(--muted);font-size:11px;font-weight:700}
.checkout-modal input{height:44px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-strong);color:var(--ink);outline:0;font:500 13px "Space Grotesk"}
.checkout-modal input:focus{border-color:#8d78ff;box-shadow:0 0 0 4px rgba(141,120,255,.13)}
.checkout-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card-error{min-height:18px;color:#e15649;font-size:11px}
.max-panel{background:linear-gradient(145deg,rgba(185,156,255,.16),var(--surface))}
.max-icon{color:#9c7dff}
.max-price{padding:6px 10px;border-radius:10px;background:rgba(185,156,255,.18);color:#8b6ce8;font-weight:800;font-size:11px}
.max-entry{width:100%;display:flex;align-items:center;gap:12px;padding:14px;margin-top:14px;border:1px solid rgba(185,156,255,.35);border-radius:16px;background:rgba(185,156,255,.1);color:var(--ink);text-align:start;transition:.18s ease;cursor:pointer}
.max-entry:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(139,108,232,.13)}
.max-entry>span:nth-child(2){display:grid;gap:3px;flex:1}
.max-entry small{color:var(--muted);font-size:11px}
.max-app-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#cdb9ff,#765bd7);color:#fff;box-shadow:0 10px 22px rgba(118,91,215,.25);flex:0 0 auto}
.max-app-icon .ico{width:22px;height:22px}
.max-modal{width:min(94vw,620px);max-height:88vh;overflow:auto}
.max-modal-head{display:flex;align-items:center;gap:13px}
.max-modal-head>div:last-child{flex:1}
.max-app-showcase{display:flex;justify-content:center;align-items:end;gap:14px;margin:22px auto 8px;min-height:100px}
.app-icon-card{width:70px;height:70px;display:grid;place-items:center;border-radius:22px;color:#fff;font:800 34px "Space Grotesk";box-shadow:0 16px 25px rgba(40,40,80,.18);transition:.2s ease}
.app-icon-card:nth-child(1){transform:rotate(-8deg) translateY(10px)}
.app-icon-card:nth-child(3){transform:rotate(8deg) translateY(10px)}
.app-icon-card:hover{transform:translateY(-5px) rotate(0)}
.app-icon-blue{background:linear-gradient(145deg,#5e7bff,#2d47b9)}
.app-icon-coral{width:90px;height:90px;border-radius:28px;background:linear-gradient(145deg,#ff8d7f,#d84863);font-size:42px}
.app-icon-violet{background:linear-gradient(145deg,#ba9dff,#7658ce)}
.max-dots{display:flex;justify-content:center;gap:7px;margin:8px 0 18px}
.max-dot{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:var(--line);transition:.18s ease;cursor:pointer}
.max-dot.active{width:22px;border-radius:8px;background:#9c7dff}
.max-feature-detail{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;padding:16px;border:1px solid rgba(185,156,255,.3);border-radius:20px;background:linear-gradient(145deg,rgba(185,156,255,.12),var(--surface-strong))}
.feature-example{width:100%;min-height:160px;display:grid;align-content:center;gap:12px;padding:14px;border-radius:16px;background:linear-gradient(145deg,#f2f4ff,#e4e7ff);color:#29315a}
.example-profile{display:flex;align-items:center;gap:6px;font-size:10px}
.example-avatar{width:27px;height:27px;display:grid;place-items:center;border-radius:9px;color:#fff;background:linear-gradient(145deg,#ff8c7d,#d84863);font-weight:800}
.profile-app-badge{width:15px;height:15px;display:grid;place-items:center;border-radius:5px;color:#fff;background:linear-gradient(145deg,#7658ce,#b99cff);font:800 8px Arial}
.example-ui-image{padding:8px;border-radius:10px;background:#fff;box-shadow:0 5px 13px rgba(54,60,110,.1)}
.example-ui-top{display:flex;align-items:center;gap:4px}
.mini-dot{width:5px;height:5px;border-radius:50%;background:#ff8174}
.mini-line{height:4px;flex:1;border-radius:4px;background:#dfe3f6}
.example-ui-body{display:grid;gap:5px;margin-top:9px}
.example-ui-body span{height:7px;border-radius:4px;background:linear-gradient(90deg,#c8d0ff,#edf0ff)}
.example-ui-body span:nth-child(2){width:75%}
.example-ui-body span:nth-child(3){width:50%}
.example-ui-image small{display:block;margin-top:8px;color:#9298b5;font-size:7px}
.feature-kicker{display:block;color:#8d6cf0;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.feature-detail-copy h3{margin:5px 0 7px;font-size:17px}
.feature-detail-copy p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}
.max-feature-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.max-feature-tab{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface-strong);color:var(--muted);font-size:10px;transition:.15s ease;cursor:pointer}
.max-feature-tab .ico{width:16px;height:16px}
.max-feature-tab.active{border-color:#a886fa;color:#825ee5;background:rgba(185,156,255,.14)}
.max-subscribe{margin-top:12px}
/* Call history */
.call-log-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border-bottom:1px solid var(--line);transition:.15s ease}
.call-log-row:hover{background:var(--bg-soft)}
.call-log-row .call-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:rgba(82,105,222,.14);color:#5269de;flex:0 0 auto}
.call-log-row .call-icon.missed{background:rgba(237,80,72,.14);color:#ed5048}
.call-log-row>div:nth-child(2){flex:1;min-width:0}
.call-log-row strong{font-size:12.5px;display:block}
.call-log-row span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
/* Mobile */
.bottom-nav{display:none}
@media (max-width:1024px){
  .onboarding{grid-template-columns:1fr;max-width:640px;padding:40px 22px 60px}
  .onboarding-visual{min-height:340px;order:2}
  .visual-orbit{width:min(380px,76vw)}
  .onboarding-copy{order:1}
  .content-grid{grid-template-columns:1fr}
  .side-column{grid-template-columns:repeat(2,1fr);position:static}
  .messages-layout{grid-template-columns:1fr;min-height:auto}
  .thread-list{max-height:280px;border-inline-end:0;border-bottom:1px solid var(--line)}
  .chat{height:auto;min-height:520px}
  .settings-grid{grid-template-columns:1fr}
}
@media (max-width:720px){
  .app-layout{display:block;padding-bottom:86px}
  .sidebar{display:none}
  .main-pane{padding:18px 14px 30px}
  .topbar{align-items:flex-start}
  .top-actions .desktop-only{display:none}
  .search-bar{margin:20px 0 18px}
  .content-grid,.page-wrap{margin-top:0}
  .side-column{display:none}
  .bottom-nav{position:fixed;z-index:40;bottom:10px;inset-inline:10px;height:62px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
  .bottom-nav .nav-item{min-height:48px;padding:0;justify-content:center;flex-direction:column;gap:2px;font-size:9px}
  .bottom-nav .nav-icon{width:auto}
  .bottom-nav .nav-badge{position:absolute;top:2px;inset-inline-end:14px;min-width:15px;padding:0 4px;font-size:9px}
  .profile-hero{padding:18px}
  .profile-stats{width:100%;margin-inline-start:0;justify-content:space-between;margin-top:12px}
  .auth-foot{align-items:stretch;flex-direction:column}
  .legal-note{max-width:none}
  .auth-foot .btn{width:100%}
  .fullscreen-modal .modal{padding:18px 14px 90px}
  .settings-grid{grid-template-columns:1fr}
  .max-feature-detail{grid-template-columns:1fr;gap:12px}
  .feature-example{min-height:130px}
  .app-icon-card{width:58px;height:58px}
  .app-icon-coral{width:76px;height:76px}
  .composer-tool{width:36px;height:36px}
  .thread-list{max-height:240px}
}
@media (max-width:430px){
  .onboarding{padding:24px 14px 40px}
  .onboarding-visual{min-height:280px}
  .visual-orbit{width:250px}
  .orbit-card{min-width:140px;padding:11px;transform:scale(.82) !important}
  .orbit-card.one{inset-inline-start:-18px}
  .orbit-card.two{inset-inline-end:-16px}
  .orbit-card.three{inset-inline-start:-8px}
  .orbit-center b{font-size:20px}
  .onboarding h1{font-size:38px}
  .post-actions{gap:2px;justify-content:space-between}
  .action-btn{padding:7px 5px}
  .call-stage{aspect-ratio:4/5}
  .call-action{width:50px;height:50px}
  .call-action.end{width:64px}
  .call-stage .call-self{width:80px;height:104px}
  .emoji-pop{width:210px}
  .emoji-item{width:30px;height:30px;font-size:17px}
  .sticker-pop{width:240px}
}
@keyframes orbitFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes shake{15%,85%{transform:translateX(-3px)}35%,65%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes heartBurst{0%{transform:scale(1)}45%{transform:scale(1.22) rotate(-8deg)}100%{transform:scale(1)}}
@keyframes sheetIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseRecord{0%,100%{box-shadow:0 0 0 0 rgba(255,107,95,.2)}50%{box-shadow:0 0 0 7px rgba(255,107,95,.06)}}
@keyframes callRipple{0%{width:120px;height:120px;opacity:.75}100%{width:340px;height:340px;opacity:0}}
.heart-burst{animation:heartBurst .48s ease both}
</style>

  if(params)for(const k in params)str=str.replace(new RegExp('\\{'+k+'\\}','g'),params[k]);
  return str;
}

    if(!Array.isArray(db.unsent))db.unsent=[];
    if(!Array.isArray(db.calls))db.calls=[];
    if(!Array.isArray(db.direct))db.direct=[];
    if(!Array.isArray(db.stories))db.stories=[];

/* ---------- Utilities ---------- */
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
    if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));
    else localStorage.removeItem(SESSION_KEY);
  }catch(e){console.warn('persist failed',e);}
}
function currentUser(){return session?db.accounts.find(a=>a.id===session.userId)||null:null;}
function accountById(id){return db.accounts.find(a=>a.id===id)||null;}
function accountByUsername(u){return db.accounts.find(a=>a.username.toLowerCase()===String(u).replace('@','').toLowerCase())||null;}
function initials(u=''){return String(u).replace('@','').slice(0,2).toUpperCase()||'YG';}
function esc(v=''){return String(v).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function timeAgo(iso){
  const diff=Date.now()-new Date(iso).getTime();
  const s=Math.floor(diff/1000);
  if(s<60)return db.settings.lang==='ar'?'الآن':`${s}s`;
  const m=Math.floor(s/60);if(m<60)return db.settings.lang==='ar'?`${m} د`:`${m}m`;
  const h=Math.floor(m/60);if(h<24)return db.settings.lang==='ar'?`${h} س`:`${h}h`;
  const d=Math.floor(h/24);if(d<7)return db.settings.lang==='ar'?`${d} ي`:`${d}d`;
  return new Date(iso).toLocaleDateString(db.settings.lang==='ar'?'ar-EG':'en-US',{year:'numeric',month:'short',day:'numeric'});
}
function uid(p='id'){return`${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;}
function toast(msg,type='info'){
  const region=document.getElementById('toastRegion');
  if(!region)return;
  const el=document.createElement('div');
  el.className='toast'+(type==='error'?' error':'');
  el.innerHTML=`${icon(type==='error'?'alert':'check')}<span>${esc(msg)}</span>`;
  region.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(8px)';el.style.transition='.25s';setTimeout(()=>el.remove(),260);},3400);
}
function isFriday(){return new Date().getDay()===5;}
function hasBlocked(aId,bId){return db.blocked.some(x=>x.userId===aId&&x.blockedId===bId);}
function isBlockedBetween(a,b){return hasBlocked(a,b)||hasBlocked(b,a);}
function formatNumber(n){return new Intl.NumberFormat(db.settings.lang==='ar'?'ar-EG':'en-US').format(n);}
function richText(text){
  return esc(text)
    .replace(/(^|\s)(@[a-zA-Z0-9._]{2,30})/g,(m,p,u)=>`${p}<a class="mention" data-mention="${esc(u)}">${esc(u)}</a>`)
    .replace(/(^|\s)(#[^\s#@]{1,40})/g,(m,p,h)=>`${p}<a class="hashtag" data-hashtag="${esc(h)}">${esc(h)}</a>`);
}

/* ---------- Phone validation ---------- */
const SUPPORTED_PREFIXES={'+20':'Egypt','+212':'Morocco','+213':'Algeria','+216':'Tunisia','+218':'Libya','+222':'Mauritania','+249':'Sudan','+966':'Saudi Arabia','+971':'United Arab Emirates','+974':'Qatar'};
function validatePhone(phone){
  const clean=phone.trim();
  const prefix=Object.keys(SUPPORTED_PREFIXES).sort((a,b)=>b.length-a.length).find(p=>clean.startsWith(p));
  return /^\+\d{8,15}$/.test(clean)&&!!prefix?{valid:true,country:SUPPORTED_PREFIXES[prefix]}:{valid:false};
}
function validUsername(v){return /^[a-zA-Z0-9._]{3,24}$/.test(v)&&!/^\d+$/.test(v);}

/* ---------- Avatar helper ---------- */
function avatar(username,extra=''){
  const u=accountByUsername(username);
  if(u?.photo)return`<span class="avatar ${extra}"><img src="${u.photo}" alt="" /></span>`;
  return`<span class="avatar ${extra}">${esc(initials(username))}</span>`;
}
function avatarById(id,extra=''){
  const u=accountById(id);
  return u?avatar(u.username,extra):`<span class="avatar ${extra}">?</span>`;
}

/* ---------- Notifications ---------- */
function pushNotification({userId,type,fromId,text,ref}){
  if(!userId||userId===fromId)return;
  if(isBlockedBetween(userId,fromId))return;
  db.notifications.push({
    id:uid('notif'),
    userId,
    type,
    fromId:fromId||null,
    text:text||'',
    ref:ref||null,
    read:false,
    createdAt:new Date().toISOString()
  });
  persist();
}
function unreadNotifCount(){const u=currentUser();if(!u)return 0;return db.notifications.filter(n=>n.userId===u.id&&!n.read).length;}
function unreadMessageCount(){
  const u=currentUser();if(!u)return 0;
  let count=0;
  db.direct.forEach(d=>{
    if(d.a!==u.id&&d.b!==u.id)return;
    const other=d.a===u.id?d.b:d.a;
    if(isBlockedBetween(u.id,other))return;
    (d.messages||[]).forEach(m=>{if(m.fromId!==u.id&&!m.read&&!m.deleted)count++;});
  });
  return count;
}

/* ---------- Follow system ---------- */
function isFollowing(a,b){return db.follows.some(f=>f.a===a&&f.b===b);}
function isPending(a,b){return db.followRequests.some(r=>r.a===a&&r.b===b);}
function followersOf(id){return db.follows.filter(f=>f.b===id).map(f=>f.a);}
function followingOf(id){return db.follows.filter(f=>f.a===id).map(f=>f.b);}
function toggleFollow(targetId){
  const u=currentUser();if(!u||!targetId)return;
  if(targetId===u.id)return toast(t('cannotFollowSelf'),'error');
  if(isBlockedBetween(u.id,targetId))return toast(t('blockedMessage'),'error');
  const target=accountById(targetId);if(!target)return;
  const followIdx=db.follows.findIndex(f=>f.a===u.id&&f.b===targetId);
  if(followIdx>=0){
    db.follows.splice(followIdx,1);
    persist();
    toast(t('unfollowed',{u:target.username}));
    render();
    return;
  }
  const reqIdx=db.followRequests.findIndex(r=>r.a===u.id&&r.b===targetId);
  if(reqIdx>=0){
    db.followRequests.splice(reqIdx,1);
    persist();
    render();
    return;
  }
  if(db.settings.privacy==='private'||target.private){
    db.followRequests.push({id:uid('req'),a:u.id,b:targetId,createdAt:new Date().toISOString()});
    persist();
    toast(t('followRequestSent'));
  }else{
    db.follows.push({a:u.id,b:targetId,createdAt:new Date().toISOString()});
    pushNotification({userId:targetId,type:'follow',fromId:u.id,text:t('startedFollowing')});
    persist();
    toast(t('nowFollowing',{u:target.username}));
  }
  render();
}
function acceptFollowRequest(reqId){
  const u=currentUser();if(!u)return;
  const idx=db.followRequests.findIndex(r=>r.id===reqId&&r.b===u.id);
  if(idx<0)return;
  const req=db.followRequests[idx];
  db.followRequests.splice(idx,1);
  db.follows.push({a:req.a,b:req.b,createdAt:new Date().toISOString()});
  pushNotification({userId:req.a,type:'follow_accepted',fromId:u.id,text:t('followRequestAccepted')});
  persist();
  toast(t('followRequestAccepted'));
  render();
}
function declineFollowRequest(reqId){
  const u=currentUser();if(!u)return;
  const idx=db.followRequests.findIndex(r=>r.id===reqId&&r.b===u.id);
  if(idx<0)return;
  db.followRequests.splice(idx,1);
  persist();
  toast(t('followRequestDeclined'));
  render();
}

/* ---------- Direct messages ---------- */
function getDirectThread(otherId){
  const u=currentUser();if(!u)return null;
  let d=db.direct.find(x=>(x.a===u.id&&x.b===otherId)||(x.a===otherId&&x.b===u.id));
  if(!d){
    d={id:uid('dm'),a:u.id,b:otherId,messages:[],createdAt:new Date().toISOString()};
    db.direct.push(d);
    persist();
  }
  return d;
}
function directThreadsFor(id){
  return db.direct
    .filter(d=>d.a===id||d.b===id)
    .filter(d=>{const other=d.a===id?d.b:d.a;return !isBlockedBetween(id,other);})
    .sort((a,b)=>{
      const la=a.messages.length?a.messages[a.messages.length-1].createdAt:a.createdAt;
      const lb=b.messages.length?b.messages[b.messages.length-1].createdAt:b.createdAt;
      return new Date(lb)-new Date(la);
    });
}
function sendDirectMessage(threadId,text,audio){
  const u=currentUser();if(!u)return;
  const d=db.direct.find(x=>x.id===threadId);if(!d)return;
  const other=d.a===u.id?d.b:d.a;
  if(isBlockedBetween(u.id,other))return toast(t('blockedMessage'),'error');
  d.messages.push({
    id:uid('msg'),
    fromId:u.id,
    text:text||'',
    audio:audio||null,
    createdAt:new Date().toISOString(),
    read:false,
    deleted:false,
    edited:false
  });
  pushNotification({userId:other,type:'message',fromId:u.id,text:text||t('voiceNote'),ref:d.id});
  persist();
}

/* ---------- Story ---------- */
function activeStories(){
  const cutoff=Date.now()-24*60*60*1000;
  return db.stories.filter(s=>new Date(s.createdAt).getTime()>cutoff);
}
function storiesForUser(userId){return activeStories().filter(s=>s.userId===userId).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));}
function groupedStories(){
  const u=currentUser();if(!u)return[];
  const list=activeStories();
  const map=new Map();
  list.forEach(s=>{
    if(!map.has(s.userId))map.set(s.userId,[]);
    map.get(s.userId).push(s);
  });
  const result=[];
  map.forEach((items,userId)=>{
    if(isBlockedBetween(u.id,userId))return;
    items.sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
    const seen=items.every(s=>(s.viewedBy||[]).includes(u.id));
    result.push({userId,items,seen});
  });
  const mine=result.find(r=>r.userId===u.id);
  const others=result.filter(r=>r.userId!==u.id);
  others.sort((a,b)=>{
    const at=new Date(a.items[a.items.length-1].createdAt).getTime();
    const bt=new Date(b.items[b.items.length-1].createdAt).getTime();
    return bt-at;
  });
  return [...others,mine].filter(Boolean);
}

function bindOnboarding(){
  const form=document.getElementById('authForm');
  const phone=document.getElementById('phoneInput');
  const username=document.getElementById('usernameInput');
  const hint=document.getElementById('countryHint');
  if(!form||!phone||!username)return;
  phone.addEventListener('input',()=>{
    const raw=phone.value.startsWith('+')?phone.value:`+${phone.value}`;
    const r=validatePhone(raw);
    hint.textContent=r.valid?t('region_supported',{c:r.country}):t('regionsSupported');
  });
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const ph=phone.value.trim().startsWith('+')?phone.value.trim():`+${phone.value.trim()}`;
    const un=username.value.trim().replace(/^@/,'');
    const p=validatePhone(ph);
    const existing=db.accounts.find(a=>a.phone===ph&&a.username.toLowerCase()===un.toLowerCase());
    if(existing)return openDeviceLogin(existing);
    let ok=true;
    if(!p.valid){
      document.getElementById('phoneWrap').classList.add('invalid');
      setTimeout(()=>document.getElementById('phoneWrap').classList.remove('invalid'),480);
      ok=false;
    }
    if(!validUsername(un)||db.accounts.some(a=>a.username.toLowerCase()===un.toLowerCase())){
      document.getElementById('usernameWrap').classList.add('invalid');
      setTimeout(()=>document.getElementById('usernameWrap').classList.remove('invalid'),480);
      ok=false;
    }
    if(!ok)return;
    const a={
      id:uid('user'),
      phone:ph,
      username:un,
      country:p.country,
      createdAt:new Date().toISOString(),
      bio:'',
      private:false
    };
    db.accounts.push(a);
    const d={
      id:uid('device'),
      userId:a.id,
      name:/mobile|android|iphone/i.test(navigator.userAgent)?(db.settings.lang==='ar'?'متصفح الجوال':'Mobile browser'):(db.settings.lang==='ar'?'المتصفح الحالي':'Current browser'),
      type:/mobile|android|iphone/i.test(navigator.userAgent)?'mobile':'desktop',
      meta:navigator.platform||'Web session',
      lastActive:new Date().toISOString()
    };
    db.devices.push(d);
    session={userId:a.id,deviceId:d.id};
    persist();
    toast(t('makeEntrance'));
    render();
  });
}

/* ---------- Device verify (openDeviceLogin) ---------- */
function openDeviceLogin(account){
  const event={
    id:uid('security'),
    userId:account.id,
    code:String(Math.floor(10000+Math.random()*90000)),
    createdAt:new Date().toISOString(),
    deviceName:/mobile|android|iphone/i.test(navigator.userAgent)?(db.settings.lang==='ar'?'متصفح الجوال':'Mobile browser'):(db.settings.lang==='ar'?'متصفح جديد':'New browser'),
    used:false
  };
  db.securityEvents.push(event);
  persist();
  modalRoot.innerHTML=`<div class="overlay" data-close-overlay>
    <div class="modal small verify-modal">
      <div class="modal-head">
        <div>
          <div class="page-kicker">${db.settings.lang==='ar'?'دعم يوجرم':'Yogarm Support'}</div>
          <h2>${t('verifyDevice')}</h2>
          <p>${t('verifySub')}</p>
        </div>
        <button class="close-btn" data-action="close-modal" aria-label="${t('close')}">${icon('close')}</button>
      </div>
      <div class="verify-lock">${icon('shield')}</div>
      <div class="code-inputs">${[0,1,2,3,4].map(i=>`<input maxlength="1" inputmode="numeric" data-code-index="${i}" aria-label="${t('codeDigit',{n:i+1})}" />`).join('')}</div>
      <div class="helper-line">${icon('lock')} ${t('openSupportForCode')}</div>
      <div class="modal-actions">
        <button class="btn btn-primary btn-full" data-action="verify-device" data-id="${event.id}">${t('verifyEnter')} ${icon('arrow')}</button>
      </div>
    </div>
  </div>`;
  const first=modalRoot.querySelector('[data-code-index]');
  if(first)first.focus();
  modalRoot.querySelectorAll('[data-code-index]').forEach((input,i)=>{
    input.addEventListener('input',()=>{
      input.value=input.value.replace(/\D/g,'').slice(0,1);
      if(input.value&&i<4){
        const next=modalRoot.querySelector(`[data-code-index="${i+1}"]`);
        if(next)next.focus();
      }
    });
    input.addEventListener('keydown',e=>{
      if(e.key==='Backspace'&&!input.value&&i>0){
        const prev=modalRoot.querySelector(`[data-code-index="${i-1}"]`);
        if(prev)prev.focus();
      }
    });
  });
}

    return`<div class="user-card">

function notifRowHTML(n){
  const from=n.fromId?accountById(n.fromId):null;
  const typeIcon=n.type==='like'?'heart':n.type==='follow'||n.type==='follow_accepted'?'user-plus':n.type==='comment'?'comment':'message';
  const typeClass=n.type==='like'?'like':n.type==='follow'||n.type==='follow_accepted'?'follow':n.type==='comment'?'comment':'message';
  return`<div class="notif-row ${n.read?'':'unread'}">
    <div class="notif-icon ${typeClass}">${icon(typeIcon)}</div>

      <strong>${from?`@${esc(from.username)}`:(db.settings.lang==='ar'?'النظام':'System')}</strong>

  </div>`;
}
function notifText(n){
  switch(n.type){
    case 'like':return t('likedYourPost');
    case 'comment':return t('commentedOnYourPost');
    case 'follow':return t('startedFollowing');
    case 'follow_accepted':return db.settings.lang==='ar'?'قبل طلب متابعتك':'accepted your follow request';
    case 'message':return t('sentYouMessage');
    case 'mention':return t('mentionedYou');
    default:return n.text||'';
  }
}

      ${navItem('home',t('home'),'home')}

      ${navItem('search',t('searchTab'),'search')}
      ${navItem('notifications',t('notifications'),'bell',nNotif)}
      ${navItem('profile',t('profile'),'user')}
    </nav>
  </div>`;
  bindApp();
}
function bindApp(){
  const search=document.getElementById('searchInput');
  if(search){
    let tid=null;
    search.addEventListener('input',()=>{
      clearTimeout(tid);
      tid=setTimeout(()=>{
        searchTerm=search.value.trim();
        if(searchTerm){
          if(activeView!=='search')activeView='search';
          render();
          setTimeout(()=>{
            const s=document.getElementById('searchInput');
            if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length);}
          },0);
        }else if(activeView==='search'){
          render();
        }
      },180);
    });
  }
  const photo=document.getElementById('photoInput');
  if(photo)photo.addEventListener('change',e=>{
    const f=e.target.files?.[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{currentUser().photo=r.result;persist();render();toast(t('profilePhotoUpdated'));};
    r.readAsDataURL(f);
  });
  const chatBody=document.getElementById('chatBody');
  if(chatBody)chatBody.scrollTop=chatBody.scrollHeight;
}

async function startCamera(){
  stopCamera();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast(t('cameraNotSupported'),'error');closeModal();return;}
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cameraFacing,width:{ideal:1280},height:{ideal:720}},audio:false});
    const v=document.getElementById('cameraVideo');
    if(v){
      v.srcObject=cameraStream;
      v.classList.toggle('mirror',cameraFacing==='user');
      await v.play().catch(()=>{});
    }
  }catch{toast(t('cameraPermission'),'error');closeModal();}
}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(tr=>tr.stop());cameraStream=null;}}
function snapCameraPhoto(){
  const v=document.getElementById('cameraVideo');
  if(!v||!cameraStream)return;
  const flash=document.getElementById('cameraFlash');
  if(flash){flash.classList.add('on');setTimeout(()=>flash.classList.remove('on'),160);}
  const canvas=document.createElement('canvas');
  canvas.width=v.videoWidth||720;canvas.height=v.videoHeight||960;
  const ctx=canvas.getContext('2d');
  if(cameraFacing==='user'){ctx.translate(canvas.width,0);ctx.scale(-1,1);}
  ctx.drawImage(v,0,0,canvas.width,canvas.height);
  const dataUrl=canvas.toDataURL('image/jpeg',.88);
  if(cameraTarget==='compose'){composeFiles.push(dataUrl);updateMediaPreview('compose');}
  else if(cameraTarget==='comment'){commentFiles.push(dataUrl);updateMediaPreview('comment');}
  else if(cameraTarget.startsWith('dm:')){
    const threadId=cameraTarget.slice(3);
    sendDirectMessage(threadId,'',dataUrl);
    toast(t('imageAttached'));
    closeModal();render();
    return;
  }
  else if(cameraTarget.startsWith('story:')){
    const kind=cameraTarget.slice(6);
    db.stories.push({id:uid('story'),userId:currentUser().id,kind:kind||'photo',image:dataUrl,createdAt:new Date().toISOString(),viewedBy:[currentUser().id]});
    persist();
    toast(t('storyAdded'));
    closeModal();render();
    return;
  }
  toast(t('photoCaptured'));
  closeModal();
}

function playStory(){
  if(!viewerState)return;
  const u=currentUser();
  const s=viewerState.stories[viewerState.index];
  if(!s){closeStory();return;}
  if(!s.viewedBy)s.viewedBy=[];
  if(!s.viewedBy.includes(u.id))s.viewedBy.push(u.id);

  modalRoot.innerHTML=`<div class="story-viewer">
    <div class="story-stage">
      <div class="story-progress">
        ${viewerState.stories.map((_,i)=>`<i class="${i<viewerState.index?'done':''}"><span style="${i<viewerState.index?'width:100%':''}" id="storyBar${i}"></span></i>`).join('')}
      </div>
      <div class="story-head">
        ${acc?avatar(acc.username,'sm'):''}
        <div><strong>@${esc(acc?.username||'')}</strong><span>${timeAgo(s.createdAt)}</span></div>
      </div>
      <button class="story-close" data-action="close-story" aria-label="${t('close')}">${icon('close')}</button>
      <button class="story-nav prev" data-action="story-prev" aria-label="${t('back')}"></button>
      <button class="story-nav next" data-action="story-next" aria-label="${t('seeMore')}"></button>
      ${s.image?`<img src="${s.image}" alt="" />`:''}
      ${s.text?`<div class="story-caption">${esc(s.text)}</div>`:''}
    </div>
  </div>`;
  bindModal();
  if(storyTimer)clearInterval(storyTimer);
  const duration=5000;
  const start=Date.now();
  storyTimer=setInterval(()=>{
    const elapsed=Date.now()-start;
    const pct=Math.min(100,elapsed/duration*100);
    const bar=document.getElementById('storyBar'+viewerState.index);
    if(bar)bar.style.width=pct+'%';
    if(elapsed>=duration){
      clearInterval(storyTimer);storyTimer=null;
      storyNext();
    }
  },50);
}
function storyNext(){
  if(!viewerState)return;
  viewerState.index++;
  if(viewerState.index>=viewerState.stories.length){closeStory();return;}
  playStory();
}
function storyPrev(){
  if(!viewerState)return;
  if(viewerState.index<=0){closeStory();return;}
  viewerState.index--;

}
function closeStory(){
  if(storyTimer){clearInterval(storyTimer);storyTimer=null;}
  viewerState=null;
