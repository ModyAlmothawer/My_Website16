<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ḤalāGPT</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f0f0f;
  --fg:#f0f0f0;
  --sub:#999;
  --border:#333;
  --card:#1a1a1a;
  --card2:#222;
  --btn-bg:#f0f0f0;
  --btn-fg:#0f0f0f;
  --accent:#a29bfe;
  --settings-bg:#161616;
  --settings-border:#2d2d2d
}

[data-theme="light"]{
  --bg:#fff;
  --fg:#1a1a1a;
  --sub:#888;
  --border:#e0e0e0;
  --card:#fafafa;
  --card2:#f5f5f7;
  --btn-bg:#1a1a1a;
  --btn-fg:#fff;
  --accent:#6c5ce7;
  --settings-bg:#fff;
  --settings-border:#e8e8e8
}

*,*::before,*::after{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none
}

html,body{
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--fg);
  font-family:'DM Sans',sans-serif;
  overflow:hidden;
  touch-action:manipulation;
  transition:background .4s ease,color .4s ease
}

.page{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden
}

.settings-wrap{
  position:absolute;
  top:20px;
  left:20px;
  z-index:300
}

.settings-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--fg);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .2s ease,transform .25s ease
}

.settings-btn:hover{
  background:var(--card2);
  transform:scale(1.05)
}

.settings-btn svg{
  width:18px;
  height:18px
}

.settings-menu{
  position:absolute;
  top:48px;
  left:0;
  min-width:255px;
  padding:8px;
  border-radius:16px;
  background:var(--settings-bg);
  border:1px solid var(--settings-border);
  box-shadow:none;
  opacity:0;
  transform:translateY(-8px) scale(.95);
  pointer-events:none;
  transition:all .3s cubic-bezier(.4,0,.2,1)
}

.settings-menu.open{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto
}

.settings-item{
  width:100%;
  padding:10px 12px;
  border:0;
  border-radius:10px;
  background:none;
  color:var(--fg);
  font-family:inherit;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  text-align:left;
  transition:background .2s ease
}

.settings-item:hover{
  background:var(--card2)
}

.settings-item svg{
  width:16px;
  height:16px;
  flex-shrink:0
}

.settings-divider{
  width:100%;
  height:1px;
  background:var(--border);
  margin:6px 0
}

.sub-panel{
  display:none;
  padding:4px 0;
  animation:panelIn .25s ease
}

.sub-panel.active{
  display:block
}

@keyframes panelIn{
  from{
    opacity:0;
    transform:translateX(7px)
  }
  to{
    opacity:1;
    transform:translateX(0)
  }
}

.back-btn{
  border:0;
  background:none;
  color:var(--sub);
  font-family:inherit;
  font-size:12px;
  display:flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  margin-bottom:6px;
  cursor:pointer
}

.back-btn:hover{
  color:var(--fg)
}

.panel-title{
  padding:3px 8px 10px;
  color:var(--sub);
  font-size:10px;
  font-weight:500;
  letter-spacing:.7px;
  text-transform:uppercase
}

.reset-btn{
  width:100%;
  padding:8px 12px;
  border-radius:10px;
  border:1px dashed var(--border);
  background:none;
  color:var(--sub);
  font-family:inherit;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  cursor:pointer;
  margin-top:9px;
  transition:all .2s ease
}

.reset-btn:hover{
  border-color:var(--fg);
  color:var(--fg)
}

.reset-btn svg{
  width:13px;
  height:13px
}

.color-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:4px 8px
}

.color-swatch{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  cursor:pointer
}

.theme-preview-wrap{
  position:relative;
  width:68px;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:center
}

.theme-preview{
  width:64px;
  height:64px;
  display:block;
  border-radius:50%;
  border:2px solid transparent;
  transition:transform .2s ease,border-color .2s ease
}

.theme-preview-wrap:hover .theme-preview{
  transform:scale(1.07)
}

.theme-preview.active{
  border-color:#22c55e
}

.theme-preview.active + .theme-check{
  opacity:1;
  transform:scale(1)
}

.theme-check{
  position:absolute;
  right:-2px;
  bottom:-1px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#22c55e;
  border:2px solid var(--settings-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transform:scale(.7);
  transition:opacity .18s ease,transform .18s ease
}

.theme-check svg{
  width:9px;
  height:9px
}

.color-swatch-label{
  color:var(--sub);
  font-size:10px;
  white-space:nowrap
}

.theme-options{
  display:flex;
  gap:8px;
  padding:4px 8px
}

.theme-opt{
  flex:1;
  padding:8px 6px;
  border-radius:10px;
  border:2px solid var(--border);
  background:var(--card);
  color:var(--fg);
  font-family:inherit;
  font-size:12px;
  cursor:pointer;
  text-align:center;
  transition:all .2s ease
}

.theme-opt:hover{
  border-color:var(--accent)
}

.theme-opt.active{
  border-color:var(--accent);
  background:rgba(162,155,254,.08)
}

.theme-opt .dot{
  width:18px;
  height:18px;
  border-radius:50%;
  margin:0 auto 4px;
  border:1px solid var(--border)
}

.theme-opt.light .dot{
  background:linear-gradient(135deg,#fff,#e0e0e0)
}

.theme-opt.dark .dot{
  background:linear-gradient(135deg,#1a1a1a,#444)
}

#callScreen{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:34px;
  position:relative
}

.call-timer{
  position:absolute;
  top:32px;
  color:var(--sub);
  font-size:13px;
  letter-spacing:1.5px;
  opacity:0;
  transition:opacity .35s ease
}

.call-timer.active{
  opacity:1
}

.orb-stage{
  position:relative;
  width:100%;
  height:360px;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none
}

.orb-container{
  --fx:0px;
  --fy:0px;
  --fs:1;
  --audio-scale:1;

  position:absolute;
  left:50%;
  top:50%;

  width:300px;
  height:300px;

  transform:
    translate(
      calc(-50% + var(--fx)),
      calc(-50% + var(--fy))
    )
    scale(var(--fs));

  transform-origin:center center;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:auto;
  touch-action:none;
  overflow:visible;

  z-index:100;

  cursor:default;

  background:transparent;
  border:0;
  box-shadow:none;

  transition:transform .15s ease
}

.orb-container.floating{
  position:fixed!important;

  width:100px;
  height:100px;

  left:calc(100vw - 125px);
  top:calc(100vh - 135px);

  transform:
    translate(var(--fx),var(--fy))
    scale(var(--fs));

  z-index:999999;

  cursor:grab
}

.orb-container.dragging{
  cursor:grabbing;
  transition:none
}

.orb-canvas{
  position:absolute;

  width:280px;
  height:280px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(var(--audio-scale));

  transform-origin:center center;

  background:transparent;
  box-shadow:none;
  border:0;

  overflow:visible;

  transition:transform .15s ease
}

.orb-canvas canvas{
  position:absolute;

  width:280px;
  height:280px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  background:transparent;
  border:0;
  filter:none;
  box-shadow:none;

  pointer-events:none
}

.orb-container.floating .orb-canvas{
  transform:
    translate(-50%,-50%)
    scale(
      calc(
        .47 *
        var(--audio-scale)
      )
    )
}

.orb-close{
  position:absolute;

  width:25px;
  height:25px;

  top:-4px;
  right:-4px;

  border:0;
  border-radius:50%;

  background:#555;
  color:#fff;

  padding:0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:Arial,sans-serif;
  font-size:18px;
  line-height:1;

  cursor:pointer;

  opacity:0;
  visibility:hidden;

  transform:scale(.55);

  transition:
    opacity .15s ease,
    visibility .15s ease,
    transform .15s ease,
    background .15s ease;

  z-index:40
}

.orb-container.floating .orb-close{
  top:-5px;
  right:-5px
}

.orb-container.show-close .orb-close{
  opacity:1;
  visibility:visible;
  transform:scale(1)
}

.orb-close:hover{
  background:#ff3b30
}

.orb-close:active{
  transform:scale(.9)
}

.orb-container.toggle-animation .orb-canvas{
  animation:orbMute .22s ease
}

@keyframes orbMute{
  0%{
    transform:
      translate(-50%,-50%)
      scale(
        var(--audio-scale)
      )
  }

  45%{
    transform:
      translate(-50%,-50%)
      scale(
        calc(
          .93 *
          var(--audio-scale)
        )
      )
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(
        var(--audio-scale)
      )
  }
}

.orb-container.floating.toggle-animation .orb-canvas{
  animation:orbMuteFloating .22s ease
}

@keyframes orbMuteFloating{
  0%{
    transform:
      translate(-50%,-50%)
      scale(
        calc(
          .47 *
          var(--audio-scale)
        )
      )
  }

  45%{
    transform:
      translate(-50%,-50%)
      scale(
        calc(
          .42 *
          var(--audio-scale)
        )
      )
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(
        calc(
          .47 *
          var(--audio-scale)
        )
      )
  }
}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:32px;

  min-height:72px;

  transition:
    gap .48s cubic-bezier(.2,.85,.2,1),
    transform .48s cubic-bezier(.2,.85,.2,1)
}

.btn-start{
  width:72px;
  height:72px;

  border:0;
  border-radius:50%;

  background:var(--btn-bg);
  color:var(--btn-fg);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease
}

.btn-start:hover{
  transform:scale(1.06);
  box-shadow:0 6px 28px rgba(0,0,0,.16)
}

.btn-start svg{
  width:32px;
  height:32px;
  fill:var(--btn-fg)
}

.btn-start.hidden{
  display:none
}

.ctrl-btn{
  border:0;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  background:var(--card2);

  transition:
    width .48s cubic-bezier(.2,.85,.2,1),
    height .25s ease,
    opacity .35s ease,
    transform .48s cubic-bezier(.2,.85,.2,1),
    background .2s ease,
    visibility .35s ease
}

.btn-mute{
  display:none!important;

  width:56px;
  height:56px;

  opacity:0;
  visibility:hidden;

  overflow:hidden;
  flex-shrink:0
}

.btn-mute.active{
  display:flex!important;
  opacity:1;
  visibility:visible
}

.btn-mute.muted svg{
  color:#ff3b30
}

.btn-mute svg{
  width:22px;
  height:22px;
  color:var(--fg);
  flex-shrink:0
}

.btn-end{
  display:none;

  width:56px;
  height:56px;

  flex-shrink:0;

  background:#ff3b30;

  box-shadow:
    0 4px 16px
    rgba(255,59,48,.2)
}

.btn-end.active{
  display:flex
}

.btn-end:hover{
  background:#e0332a;

  box-shadow:
    0 6px 22px
    rgba(255,59,48,.3)
}

.btn-end svg{
  width:22px;
  height:22px;
  fill:#fff
}

.controls.floating-mode{
  gap:0
}

.controls.floating-mode .btn-mute{
  width:0;
  height:56px;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:scale(.7)
}

.controls.floating-mode .btn-end{
  transform:translateX(0)
}

.status-text{
  position:absolute;
  bottom:36px;
  color:var(--sub);
  font-size:12px;
  letter-spacing:.3px;
  opacity:0;
  transition:opacity .3s ease
}

@media(max-width:600px){
  .settings-menu{
    min-width:235px
  }

  .orb-container{
    width:280px;
    height:280px
  }

  .orb-canvas,
  .orb-canvas canvas{
    width:260px;
    height:260px
  }

  .orb-container.floating{
    width:90px;
    height:90px;

    left:calc(100vw - 112px);
    top:calc(100vh - 122px)
  }

  .orb-container.floating .orb-canvas{
    transform:
      translate(-50%,-50%)
      scale(
        calc(
          .44 *
          var(--audio-scale)
        )
      )
  }

  .orb-close{
    width:24px;
    height:24px;
    top:-5px;
    right:-5px;
    font-size:17px
  }

  .orb-container.floating .orb-close{
    top:-6px;
    right:-6px
  }

  .controls{
    gap:22px
  }
}
</style>
<base target="_blank">
</head>

<body>

<div class="page">

  <div class="settings-wrap">

    <button class="settings-btn" id="settingsBtn" onclick="toggleSettings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2v-.09a1.65 1.65 0 0 0-1.51-.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2v.09A1.65 1.65 0 0 0 19.4 15z"/>
      </svg>
    </button>

    <div class="settings-menu" id="settingsMenu">

      <div class="sub-panel active" id="menuMain">

        <button class="settings-item" onclick="showPanel('menuBubble')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4"/>
          </svg>
          Bubble Theme
        </button>

        <div class="settings-divider"></div>

        <button class="settings-item" onclick="showPanel('menuTheme')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          Theme
        </button>

      </div>

      <div class="sub-panel" id="menuBubble">

        <button class="back-btn" onclick="showPanel('menuMain')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Back
        </button>

        <div class="panel-title">Muted Bubble</div>

        <div class="color-grid">

          <div class="color-swatch" onclick="setMutedColor('red')">

            <div class="theme-preview-wrap">
              <canvas class="theme-preview active" id="preview-muted-red" width="120" height="120"></canvas>

              <span class="theme-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </div>

            <span class="color-swatch-label">Red</span>

          </div>

        </div>

        <div class="settings-divider"></div>

        <div class="panel-title">Active Bubble</div>

        <div class="color-grid">

          <div class="color-swatch" onclick="setActiveColor('blue')">

            <div class="theme-preview-wrap">
              <canvas class="theme-preview active" id="preview-active-blue" width="120" height="120"></canvas>

              <span class="theme-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </div>

            <span class="color-swatch-label">Blue</span>

          </div>

          <div class="color-swatch" onclick="setActiveColor('green')">

            <div class="theme-preview-wrap">
              <canvas class="theme-preview" id="preview-active-green" width="120" height="120"></canvas>

              <span class="theme-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </div>

            <span class="color-swatch-label">Green</span>

          </div>

          <div class="color-swatch" onclick="setActiveColor('brown')">

            <div class="theme-preview-wrap">
              <canvas class="theme-preview" id="preview-active-brown" width="120" height="120"></canvas>

              <span class="theme-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </div>

            <span class="color-swatch-label">Brown</span>

          </div>

        </div>

        <div class="settings-divider"></div>

        <div class="panel-title">Speaking Bubble</div>

        <div class="color-grid">

          <div class="color-swatch" onclick="setSpeakingColor('pink')">

            <div class="theme-preview-wrap">
              <canvas class="theme-preview active" id="preview-speaking-pink" width="120" height="120"></canvas>

              <span class="theme-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </div>

            <span class="color-swatch-label">Pink</span>

          </div>

          <div class="color-swatch" onclick="setSpeakingColor('purple')">

            <div class="theme-preview-wrap">
              <canvas class="theme-preview" id="preview-speaking-purple" width="120" height="120"></canvas>

              <span class="theme-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </div>

            <span class="color-swatch-label">Purple</span>

          </div>

        </div>

        <button class="reset-btn" onclick="resetBubbleTheme()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-4.5"/>
          </svg>
          Reset to Default
        </button>

      </div>

      <div class="sub-panel" id="menuTheme">

        <button class="back-btn" onclick="showPanel('menuMain')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px">

function playAud(type){
  try{
    const t=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();

    const n=t.currentTime;

    if(type==="start"){
      [
        261.63,
        329.63,
        392,
        523.25
      ].forEach((f,i)=>{
        const o=
          t.createOscillator();

        const g=
          t.createGain();

        o.type="sine";

        o.frequency.setValueAtTime(
          f,
          n+.04*i
        );

        g.gain.setValueAtTime(
          0,
          n+.04*i
        );

        g.gain.linearRampToValueAtTime(
          .12,
          n+.04*i+.08
        );

        g.gain.exponentialRampToValueAtTime(
          1e-4,
          n+.04*i+.55
        );

        o.connect(g);
        g.connect(t.destination);

        o.start(n+.04*i);
        o.stop(n+.04*i+.55);
      });
    }

    if(type==="end"){
      [
        392,
        329.63,
        261.63
      ].forEach((f,i)=>{
        const o=
          t.createOscillator();

        const g=
          t.createGain();

        o.type="sine";

        o.frequency.setValueAtTime(
          f,
          n+.06*i
        );

        g.gain.setValueAtTime(
          0,
          n+.06*i
        );

        g.gain.linearRampToValueAtTime(
          .12,
          n+.06*i+.05
        );

        g.gain.exponentialRampToValueAtTime(
          1e-4,
          n+.06*i+.45
        );

        o.connect(g);
        g.connect(t.destination);

        o.start(n+.06*i);
        o.stop(n+.06*i+.45);
      });
    }

    if(
      type==="mute"||
      type==="unmute"
    ){
      const o=
        t.createOscillator();

      const g=
        t.createGain();

      o.type="triangle";

      o.frequency.setValueAtTime(
        type==="mute"
          ?320
          :220,
        n
      );

      o.frequency.exponentialRampToValueAtTime(
        type==="mute"
          ?160
          :440,
        n+.12
      );

      g.gain.setValueAtTime(
        .12,
        n
      );

      g.gain.exponentialRampToValueAtTime(
        1e-4,
        n+.12
      );

      o.connect(g);
      g.connect(t.destination);

      o.start();
      o.stop(n+.12);
    }
  }catch(e){}
}

function getAnalyserVolume(a){
  if(!a)return 0;

  const d=
    new Uint8Array(
      a.frequencyBinCount
    );

  a.getByteFrequencyData(d);

  let s=0;

  const len=
    Math.max(
      1,
      Math.floor(
        .75*
        d.length
      )
    );

  for(let i=0;i<len;i++){
    s+=d[i];
  }

  return(
    s/len
  )/255;
}

function f32ToBase64(f32){
  const i16=
    new Int16Array(
      f32.length
    );

  for(
    let i=0;
    i<f32.length;
    i++
  ){
    const s=
      Math.max(
        -1,
        Math.min(
          1,
          f32[i]
        )
      );

    i16[i]=
      s<0
        ?32768*s
        :32767*s;
  }

  const b=
    new Uint8Array(
      i16.buffer
    );

  let r="";

  for(
    let i=0;
    i<b.length;
    i++
  ){
    r+=String.fromCharCode(
      b[i]
    );
  }

  return btoa(r);
}

function base64ToF32(b64){
  const s=atob(b64);

  const b=
    new Uint8Array(
      s.length
    );

  for(
    let i=0;
    i<s.length;
    i++
  ){
    b[i]=
      s.charCodeAt(i);
  }

  const i16=
    new Int16Array(
      b.buffer
    );

  const f32=
    new Float32Array(
      i16.length
    );

  for(
    let i=0;
    i<i16.length;
    i++
  ){
    f32[i]=
      i16[i]/32768;
  }

  return f32;
}

function ensurePlayCtx(){
  if(
    !playCtx||
    playCtx.state==="closed"
  ){
    playCtx=
      new AudioContext({
        sampleRate:OUT_SR
      });

    playAnalyser=
      playCtx.createAnalyser();

    playAnalyser.fftSize=128;

    outputGainNode=
      playCtx.createGain();

    playAnalyser.connect(
      outputGainNode
    );

    outputGainNode.connect(
      playCtx.destination
    );

    schedAt=0;
    lastSrc=null;
  }

  if(
    outputGainNode&&
    playCtx
  ){
    outputGainNode.gain.setValueAtTime(
      isMuted?1:4,
      playCtx.currentTime
    );
  }

  return playCtx;
}

function playChunk(data){
  if(
    !callActive||
    !data
  ){
    return;
  }

  try{
    const ctx=
      ensurePlayCtx();

    const samples=
      base64ToF32(data);

    if(!samples.length){
      return;
    }

    const buf=
      ctx.createBuffer(
        1,
        samples.length,
        OUT_SR
      );

    buf.copyToChannel(
      samples,
      0
    );

    const src=
      ctx.createBufferSource();

    src.buffer=buf;

    src.connect(
      playAnalyser
    );

    const now=
      ctx.currentTime;

    if(
      schedAt<
      now+.02
    ){
      schedAt=
        now+.06;
    }

    src.start(
      schedAt
    );

    schedAt+=
      buf.duration;

    lastSrc=src;

    setOrbState(
      "speaking"
    );

    src.onended=()=>{
      if(
        src===lastSrc&&
        callActive
      ){
        lastSrc=null;

        setOrbState(
          "listening"
        );
      }
    };

  }catch(e){}
}

function stopPlayback(){
  if(playCtx){
    try{
      playCtx.close();
    }catch(e){}

    playCtx=null;
  }

  playAnalyser=null;
  outputGainNode=null;
  lastSrc=null;
  schedAt=0;
}

async function startMicStream(){
  if(
    !callActive||
    isMuted
  ){
    return;
  }

  try{
    micStream=
      await navigator.mediaDevices.getUserMedia({
        audio:{
          sampleRate:MIC_SR,
          channelCount:1,
          echoCancellation:true,
          noiseSuppression:true
        },
        video:false
      });

    micCtx=
      new AudioContext({
        sampleRate:MIC_SR
      });

    const src=
      micCtx.createMediaStreamSource(
        micStream
      );

    micAnalyser=
      micCtx.createAnalyser();

    micAnalyser.fftSize=128;

    src.connect(
      micAnalyser
    );

    processor=
      micCtx.createScriptProcessor(
        CHUNK,
        1,
        1
      );

    src.connect(
      processor
    );

    processor.connect(
      micCtx.destination
    );

    processor.onaudioprocess=e=>{
      if(
        !callActive||
        isMuted||
        !ws||
        ws.readyState!==WebSocket.OPEN||
        !setupDone
      ){
        return;
      }

      const data=
        f32ToBase64(
          e.inputBuffer.getChannelData(
            0
          )
        );

      ws.send(
        JSON.stringify({
          realtime_input:{
            media_chunks:[
              {
                mime_type:
                  "audio/pcm;rate=16000",
                data
              }
            ]
          }
        })
      );
    };

    await micCtx.resume();

    setOrbState(
      "listening"
    );

    setStatus("");

  }catch(e){
    setStatus(
      "Microphone access failed"
    );
  }
}

function stopMicStream(){

  if(micCtx){

  if(micStream){
    micStream
      .getTracks()
      .forEach(track=>{
        track.stop();
      });

    micStream=null;
  }

  micAnalyser=null;
}

function drawBlob(ctx,cx,cy,radius,phase,vol,color){
  ctx.beginPath();

  const segments=100;

  for(let i=0;i<=segments;i++){
    const angle=(i/segments)*Math.PI*2;

    const wave1=Math.sin(3*angle+phase*1.15)*10;
    const wave2=Math.cos(2*angle-phase*.75)*7;
    const wave3=Math.sin(5*angle+phase*1.35)*4;
    const wave4=Math.cos(7*angle-phase*1.65)*2.5;

    const r=
      radius+
      (wave1+wave2+wave3+wave4)*
      (.34+vol*.38);

    const x=
      cx+
      Math.cos(angle)*r;

    const y=
      cy+
      Math.sin(angle)*r;

    if(i===0){
      ctx.moveTo(x,y);
    }else{
      ctx.lineTo(x,y);
    }
  }

  ctx.closePath();

  ctx.fillStyle=color;
  ctx.fill();
}

function drawPreviewBlob(canvas,colors,phase){
  const ctx=
    canvas.getContext("2d");

  const size=
    canvas.width;

  ctx.clearRect(
    0,
    0,
    size,
    size
  );

  const cx=
    size/2;

  const cy=
    size/2;

  const radius=
    size*.235;

  const c1=
    `rgba(${colors[0][0]},${colors[0][1]},${colors[0][2]},${Math.min(colors[0][3],.18)})`;

  const c2=
    `rgba(${colors[1][0]},${colors[1][1]},${colors[1][2]},${Math.min(colors[1][3],.28)})`;

  const c3=
    `rgba(${colors[2][0]},${colors[2][1]},${colors[2][2]},${Math.min(colors[2][3],.40)})`;

  const c4=
    `rgba(${colors[3][0]},${colors[3][1]},${colors[3][2]},${Math.min(colors[3][3],.56)})`;

  ctx.save();

  ctx.globalCompositeOperation="screen";

  drawBlob(
    ctx,
    cx+1.2,
    cy+1.2,
    radius+6,
    phase,
    .025,
    c1
  );

  drawBlob(
    ctx,
    cx-.7,
    cy-.7,
    radius+1,
    phase*.82+1,
    .025,
    c2
  );

  drawBlob(
    ctx,
    cx,
    cy,
    radius-2,
    phase*1.12+2,
    .025,
    c3
  );

  drawBlob(
    ctx,
    cx,
    cy,
    radius-5,
    phase*1.18+2.4,
    .025,
    c4
  );

  ctx.restore();
}

function renderThemePreviews(){
  const t=
    Date.now()/1000;

  drawPreviewBlob(
    previewCanvases.mutedRed,
    getPreviewColors("muted"),
    t*.7
  );

  drawPreviewBlob(
    previewCanvases.activeBlue,
    getPreviewColors("active"),
    t*.72
  );

  drawPreviewBlob(
    previewCanvases.activeGreen,
    ACTIVE_PALETTES.green.listening,
    t*.72
  );

  drawPreviewBlob(
    previewCanvases.activeBrown,
    ACTIVE_PALETTES.brown.listening,
    t*.72
  );

  drawPreviewBlob(
    previewCanvases.speakingPink,
    getPreviewColors("speaking"),
    t*.75
  );

  drawPreviewBlob(
    previewCanvases.speakingPurple,
    SPEAKING_PALETTES.purple.speaking,
    t*.75
  );

  requestAnimationFrame(
    renderThemePreviews
  );
}

function drawOrb(){
  animFrame=
    requestAnimationFrame(
      drawOrb
    );

  let e=0;

  if(
    callActive&&
    aiState==="speaking"&&
    playAnalyser
  ){
    e=
      getAnalyserVolume(
        playAnalyser
      );
  }else if(
    callActive&&
    aiState==="listening"&&
    micAnalyser&&
    !isMuted
  ){
    e=
      getAnalyserVolume(
        micAnalyser
      );
  }

  if(!callActive){
    e=
      .025+
      .012*
      Math.sin(
        Date.now()/900
      );
  }

  if(
    isMuted&&
    aiState==="idle"
  ){
    e=
      .01*
      Math.sin(
        Date.now()/260
      );
  }

  audioVolume+=
    .12*
    (
      e-
      audioVolume
    );

  orbPhase+=
    .018+
    .028*
    audioVolume;

  const cfg=
    getColors();

  const effectiveState=
    isMuted&&
    aiState==="idle"
      ?"muted"
      :(callActive?
        aiState:
        "idle");

  const target=
    cfg[effectiveState]||
    cfg.idle;

  for(
    let i=0;
    i<3;
    i++
  ){
    for(
      let t=0;
      t<4;
      t++
    ){
      curC[i][t]+=
        (
          target[i][t]-
          curC[i][t]
        )*
        .055;
    }
  }

  C.clearRect(
    0,
    0,
    280,
    280
  );

  const scale=
    1+
    .025*
    audioVolume;

  orbCanvas.style.setProperty(
    "--audio-scale",
    scale
  );

  const cx=140;
  const cy=140;

  const baseRadius=
    65+
    9*
    audioVolume;

  const c1=
  `rgba(${Math.round(curC[0][0])},${Math.round(curC[0][1])},${Math.round(curC[0][2])},${curC[0][3]})`;

const c2=
  `rgba(${Math.round(curC[1][0])},${Math.round(curC[1][1])},${Math.round(curC[1][2])},${curC[1][3]})`;

const c3=
  `rgba(${Math.round(curC[2][0])},${Math.round(curC[2][1])},${Math.round(curC[2][2])},${curC[2][3]})`;

C.save();

C.globalCompositeOperation="screen";

drawBlob(
  C,
  cx+3,
  cy+3,
  baseRadius+9,
  orbPhase,
  audioVolume,
  c1
);

drawBlob(
  C,
  cx-1.5,
  cy-1.5,
  baseRadius+2,
  orbPhase*.82+1,
  audioVolume,
  c2
);

drawBlob(
  C,
  cx,
  cy,
  baseRadius-4,
  orbPhase*1.12+2,
  audioVolume,
  c3
);

C.restore();

  C.globalCompositeOperation=
    "source-over";

  drawBlob(
    C,
    cx,
    cy,
    baseRadius-5,
    orbPhase*1.2+2,
    audioVolume,
    c3
  );
}

function showOrbClose(){

    orbCloseTimer

  if(

function getFloatingSize(){
  return window.innerWidth<=600
    ?90
    :100;
}

function getFloatingPosition(){
  const size=
    getFloatingSize();

  return{
    left:
      Math.max(
        6,
        window.innerWidth-
        size-
        22
      ),

    top:
      Math.max(
        6,
        window.innerHeight-
        size-
        28
      )
  };
}

function animateBigToFloating(){
  const first=
    orbContainer.getBoundingClientRect();

  const size=
    getFloatingSize();

  const pos=
    getFloatingPosition();

  orbContainer.style.position=
    "fixed";

  orbContainer.style.width=
    size+
    "px";

  orbContainer.style.height=
    size+
    "px";

  orbContainer.style.left=
    pos.left+
    "px";

  orbContainer.style.top=
    pos.top+
    "px";

  orbContainer.classList.add(
    "floating"
  );

  orbContainer.style.setProperty(
    "--fx",
    "0px"
  );

  orbContainer.style.setProperty(
    "--fy",
    "0px"
  );

  orbContainer.style.setProperty(
    "--fs",
    "1"
  );

  const last=
    orbContainer.getBoundingClientRect();

  const firstX=
    first.left+
    first.width/2;

  const firstY=
    first.top+
    first.height/2;

  const lastX=
    last.left+
    last.width/2;

  const lastY=
    last.top+
    last.height/2;

  const dx=
    firstX-
    lastX;

  const dy=
    firstY-
    lastY;

  const scale=
    first.width/
    last.width;

  orbContainer.style.setProperty(
    "--fx",
    dx+
    "px"
  );

  orbContainer.style.setProperty(
    "--fy",
    dy+
    "px"
  );

  orbContainer.style.setProperty(
    "--fs",
    scale
  );

  void orbContainer.offsetWidth;

  requestAnimationFrame(()=>{
    orbContainer.style.transition=
      "transform .72s cubic-bezier(.16,.85,.2,1)";

    orbContainer.style.setProperty(
      "--fx",
      "0px"
    );

    orbContainer.style.setProperty(
      "--fy",
      "0px"
    );

    orbContainer.style.setProperty(
      "--fs",
      "1"
    );

    controls.classList.add(
      "floating-mode"
    );

    setTimeout(()=>{
      orbContainer.style.transition="";

      showOrbClose();
    },740);
  });
}

async function openOrbPiP(){
  if(
    !callActive||
    pipRequested||
    !window.documentPictureInPicture||
    !window.isSecureContext
  ){
    return null;
  }

  pipRequested=true;

  try{
    const win=
      await window.documentPictureInPicture.requestWindow({
        width:180,
        height:180,
        preferInitialWindowPlacement:false,
        disallowReturnToOpener:true
      });

    pipWindow=win;

    preparePiPWindow(
      win
    );

    return win;

  }catch(e){
    pipRequested=false;
    pipWindow=null;
    return null;
  }
}

function moveOrbToPiP(){
  if(
    !pipWindow||
    !pipWindow.document||
    !pipWindow.document.body||
    !callActive
  ){
    return;
  }

  if(
    orbContainer.ownerDocument===
    pipWindow.document
  ){
    return;
  }

  pipWindow.document.body.appendChild(
    orbContainer
  );

  orbContainer.style.position=
    "absolute";

  orbContainer.style.width=
    "100px";

  orbContainer.style.height=
    "100px";

  orbContainer.style.left=
    "40px";

  orbContainer.style.top=
    "40px";

  orbContainer.style.setProperty(
    "--fx",
    "0px"
  );

  orbContainer.style.setProperty(
    "--fy",
    "0px"
  );

  orbContainer.style.setProperty(
    "--fs",
    "1"
  );
}

function minimizeOrb(){
  if(
    !callActive||
    orbContainer.classList.contains(
      "floating"
    )
  ){
    return;
  }

  const pipPromise=
    openOrbPiP();

  animateBigToFloating();

  pipPromise.then(win=>{
    if(
      win&&
      callActive
    ){
      setTimeout(()=>{
        moveOrbToPiP();
      },760);
    }
  });
}

function restoreFloatingOrb(){
  if(!callActive)return;

  clearTimeout(
    orbCloseTimer
  );

  orbContainer.classList.remove(
    "show-close"
  );

  if(pipWindow){
    const oldPip=
      pipWindow;

    pipWindow=null;
    pipRequested=false;

    if(
      orbContainer.ownerDocument!==
      document
    ){
      page.appendChild(
        orbContainer
      );
    }

    try{
      oldPip.close();
    }catch(e){}
  }

  animateFloatingToBig();
}

orbContainer.addEventListener(
  "pointerdown",
  e=>{
    if(!callActive)return;
    if(e.target===orbClose)return;

    if(
      !orbContainer.classList.contains(
        "floating"
      )
    ){
      return;
    }

    e.preventDefault();

    orbDragging=true;
    orbMoved=false;
    orbPointerId=e.pointerId;

    const rect=
      orbContainer.getBoundingClientRect();

    orbOffsetX=
      e.clientX-
      rect.left;

    orbOffsetY=
      e.clientY-
      rect.top;

    orbContainer.classList.add(
      "dragging"
    );

    showOrbClose();

    try{
      orbContainer.setPointerCapture(
        e.pointerId
      );
    }catch(err){}
  }
);

orbContainer.addEventListener(
  "pointermove",
  e=>{
    if(!orbDragging)return;

    if(
      e.pointerId!==orbPointerId
    ){
      return;
    }

    e.preventDefault();

    const inPiP=
      pipWindow&&
      orbContainer.ownerDocument===
      pipWindow.document;

    const host=
      inPiP?
        pipWindow:
        window;

    const width=
      orbContainer.offsetWidth;

    const height=
      orbContainer.offsetHeight;

    let left=
      e.clientX-
      orbOffsetX;

    let top=
      e.clientY-
      orbOffsetY;

    if(
      Math.abs(e.movementX)>2||
      Math.abs(e.movementY)>2
    ){
      orbMoved=true;
    }

    left=
      Math.max(
        4,
        Math.min(
          host.innerWidth-
          width-
          4,
          left
        )
      );

    top=
      Math.max(
        4,
        Math.min(
          host.innerHeight-
          height-
          4,
          top
        )
      );

    orbContainer.style.position=
      inPiP?
        "absolute":
        "fixed";

    orbContainer.style.left=
      left+
      "px";

    orbContainer.style.top=
      top+
      "px";
  }
);

function finishOrbPointer(e){
  if(!orbDragging)return;

  if(
    e.pointerId!==orbPointerId
  ){
    return;
  }

  orbDragging=false;

  orbContainer.classList.remove(
    "dragging"
  );

  try{
    orbContainer.releasePointerCapture(
      e.pointerId
    );
  }catch(err){}

  const moved=orbMoved;
  orbPointerId=null;

  if(!moved){
    toggleMute();
  }

  showOrbClose();

  // Keep the drag/click state local to this pointer interaction.
  // Without this, a previous drag can block minimize on a later call.
  setTimeout(()=>{
    if(!orbDragging){
      orbMoved=false;
    }
  },0);
}

orbContainer.addEventListener(
  "pointerup",
  finishOrbPointer
);

orbContainer.addEventListener(
  "pointercancel",
  finishOrbPointer
);

orbContainer.addEventListener(
  "click",
  e=>{
    if(!callActive)return;

    if(
      e.target===orbClose
    ){
      return;
    }

    if(
      orbContainer.classList.contains(
        "floating"
      )
    ){
      return;
    }

    if(
      !orbDragging&&
      !orbMoved
    ){
      minimizeOrb();
    }
  }
);

orbClose.addEventListener(
  "pointerdown",
  e=>{
    e.stopPropagation();
  }
);

orbClose.addEventListener(
  "click",
  e=>{
    e.stopPropagation();

    restoreFloatingOrb();
  }
);

function toggleMute(){
  if(!callActive)return;

  isMuted=!isMuted;

  if(
    orbContainer.classList.contains(
      "floating"
    )
  ){
    triggerOrbAnimation();
  }

  if(isMuted){
    playAud("mute");

    stopMicStream();

    btnMute.classList.add(
      "muted"
    );

    setMuteIcon(true);

    setOrbState(
      "idle"
    );
  }else{
    playAud("unmute");

    btnMute.classList.remove(
      "muted"
    );

    setMuteIcon(false);

    setOrbState(
      "listening"
    );

    startMicStream();
  }

  if(
    outputGainNode&&
    playCtx
  ){
    outputGainNode.gain.setValueAtTime(
      isMuted?1:4,
      playCtx.currentTime
    );
  }
}

}

async function startCall(){
  if(callActive)return;

  try{
    const test=
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    test
      .getTracks()
      .forEach(track=>{
        track.stop();
      });

  }catch(e){
    setStatus(
      "Mic permission required"
    );

    return;
  }

  callActive=true;
  endingCall=false;
  isMuted=false;
  setupDone=false;

  resetOrbInteractionState();

  audioVolume=0;
  orbPhase=0;
  aiState="idle";

  playAud("start");

  btnStart.classList.add(
    "hidden"
  );

  btnMute.classList.add(
    "active"
  );

  btnMute.classList.remove(
    "muted"
  );

  btnEnd.classList.add(
    "active"
  );

  controls.classList.remove(
    "floating-mode"
  );

  orbContainer.classList.remove(
    "floating",
    "dragging",
    "show-close",
    "toggle-animation"
  );

  orbContainer.style.position=
    "absolute";

  orbContainer.style.width=
    "300px";

  orbContainer.style.height=
    "300px";

  orbContainer.style.left=
    "50%";

  orbContainer.style.top=
    "50%";

  orbContainer.style.setProperty(
    "--fx",
    "0px"
  );

  orbContainer.style.setProperty(
    "--fy",
    "0px"
  );

  orbContainer.style.setProperty(
    "--fs",
    "1"
  );

  timerSecs=0;

  timerEl.textContent=
    "00:00";

  timerEl.classList.add(
    "active"
  );

  timerInterval=
    setInterval(()=>{
      timerSecs++;

      const m=
        String(
          Math.floor(
            timerSecs/60
          )
        ).padStart(
          2,
          "0"
        );

      const s=
        String(
          timerSecs%60
        ).padStart(
          2,
          "0"
        );

      timerEl.textContent=
        m+
        ":"+
        s;

    },1000);

  await connectWebSocket();
}

function endCall(){
  if(endingCall)return;

  endingCall=true;

  if(callActive){
    playAud("end");
  }

  callActive=false;
  setupDone=false;

  resetOrbInteractionState();

  stopMicStream();

    ws.onerror=null;

    "floating-mode"
  );

  btnMute.classList.remove(
    "active",
    "muted"
  );

  btnEnd.classList.remove(
    "active"
  );

  btnStart.classList.remove(
    "hidden"
  );

  setMuteIcon(false);

  timerEl.classList.remove(
    "active"
  );

  timerEl.textContent=
    "00:00";

  setStatus("");

  isMuted=false;
  aiState="idle";

  if(animFrame){
    cancelAnimationFrame(
      animFrame
    );

    animFrame=null;
  }

  drawOrb();

  setTimeout(()=>{
    endingCall=false;
  },300);
}

async function connectWebSocket(){
  setupDone=false;

  setOrbState(
    "idle"
  );

  setStatus(
    "Connecting..."
  );

  try{
    ws=
      new WebSocket(
        WS_URL
      );

    ws.onopen=()=>{
      setStatus("");
    };

    ws.onmessage=e=>{
      if(!callActive)return;

      const msg=
        parseGeminiMessage(
          e.data
        );

      if(msg){
        dispatchParsed(msg);
      }
    };

    ws.onerror=()=>{
      setStatus(
        "Connection error"
      );
    };

    ws.onclose=()=>{
      setupDone=false;

      if(callActive){
        setStatus(
          "Reconnecting..."
        );

        setTimeout(
          async()=>{
            if(callActive){
              stopMicStream();

              try{
                await connectWebSocket();
              }catch(e){}
            }
          },
          2500
        );
      }
    };

  }catch(e){
    setStatus(
      "Connection error"
    );

    endCall();
  }
}

function tryDecode(str){
  if(
    typeof str!=="string"
  ){
    return null;
  }

  try{
    return JSON.parse(
      atob(str)
    );
  }catch(e){
    return null;
  }
}

function isAudioBase64(str){
  return(
    typeof str==="string"&&
    str.length>=100&&
    /^[A-Za-z0-9+/]*={0,2}$/.test(
      str
    )
  );
}

function collectAudio(obj,arr){
  if(
    !obj||
    typeof obj!=="object"
  ){
    return;
  }

  if(Array.isArray(obj)){
    obj.forEach(item=>{
      collectAudio(
        item,
        arr
      );
    });

    return;
  }

  for(
    const key of Object.keys(obj)
  ){
    const value=
      obj[key];

    if(
      key==="data"&&
      isAudioBase64(value)
    ){
      arr.push(
        value
      );
    }else{
      collectAudio(
        value,
        arr
      );
    }
  }
}

function parseGeminiMessage(data){
  let parsed=null;

  if(
    typeof data==="string"
  ){
    try{
      parsed=
        JSON.parse(
          data
        );
    }catch(e){
      const d=
        tryDecode(data);

      if(d){
        parsed=d;
      }
    }
  }else if(
    data instanceof Blob
  ){
    data.text().then(
      text=>{
        try{
          dispatchParsed(
            JSON.parse(
              text
            )
          );
        }catch(e){
          const d=
            tryDecode(text);

          if(d){
            dispatchParsed(d);
          }
        }
      }
    );

    return null;
  }

  return parsed;
}

function dispatchParsed(e){
  if(!callActive){
    return;
  }

  if(
    e.setupComplete!==undefined
  ){
    setupDone=true;

    setTimeout(()=>{
      startMicStream();
    },100);

    return;
  }

  if(e.serverContent){
    const sc=
      e.serverContent;

    if(sc.modelTurn){
      const chunks=[];

      collectAudio(
        sc.modelTurn,
        chunks
      );

      chunks.forEach(
        chunk=>{
          playChunk(chunk);
        }
      );

      const parts=
        sc.modelTurn.parts||
        [];

      parts.forEach(
        part=>{
          if(part.text){
            setOrbState(
              "thinking"
            );
          }
        }
      );
    }

    if(sc.interrupted){
      stopPlayback();

      setOrbState(
        "listening"
      );
    }

    return;
  }

  const chunks=[];

  collectAudio(
    e,
    chunks
  );

  chunks.forEach(
    chunk=>{
      playChunk(chunk);
    }
  );
}

document.addEventListener(
  "contextmenu",
  e=>{
    e.preventDefault();
  }
);

document.addEventListener(
  "selectstart",
  e=>{
    e.preventDefault();
  }
);

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(
      document.hidden&&
      callActive&&
      orbContainer.classList.contains(
        "floating"
      )&&
      !pipRequested&&
      window.documentPictureInPicture
    ){
      openOrbPiP();
    }
  }
);

if(
  window.documentPictureInPicture
){
  window.documentPictureInPicture.addEventListener(
    "enter",
    event=>{
      if(!callActive){
        return;
      }

      pipWindow=
        event.window;

      pipRequested=
        true;

      if(
        orbContainer.ownerDocument!==
        pipWindow.document
      ){
        preparePiPWindow(
          pipWindow
        );

        moveOrbToPiP();
      }
    }
  );
}

setTheme("dark");
refreshThemeSelection();

requestAnimationFrame(
  renderThemePreviews
);

drawOrb();
</script>
